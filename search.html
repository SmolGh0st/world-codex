<script>
(function(){var r=document.documentElement;try{
var look=localStorage.getItem('cdb-look');if(['field','atlas','board'].indexOf(look)<0)look='field';
r.dataset.theme=look;
var t=localStorage.getItem('cdb-theme');
var dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
r.dataset.face=dark?'night':'day';}catch(e){}})();
</script>

<main>

<section class="search-ui">
<h1>Search</h1>
<input id="q" type="search" placeholder="Type to search - use &quot;quotes&quot; for phrases" autofocus>
<p class="dim" id="count"></p>
<ul id="results" class="results"></ul>
</section>
<script src="assets/search-index.js"></script>
<script>
(function(){
  const q = document.getElementById('q'), results = document.getElementById('results'),
        count = document.getElementById('count');
  function terms(s){
    const out = []; const re = /"([^"]+)"|(\S+)/g; let m;
    while ((m = re.exec(s))) out.push((m[1] || m[2]).toLowerCase());
    return out;
  }
  function run(){
    const ts = terms(q.value.trim());
    results.innerHTML = ''; count.textContent = '';
    if (!ts.length) return;
    const scored = [];
    for (const d of SEARCH_INDEX){
      let score = 0, ok = true;
      for (const t of ts){
        let s = 0;
        if (d.t.toLowerCase().includes(t)) s += 8;
        if (d.g.toLowerCase().includes(t)) s += 4;
        if (d.a.toLowerCase().includes(t)) s += 4;
        if (d.f.toLowerCase().includes(t)) s += 2;
        if (d.b.toLowerCase().includes(t)) s += 1;
        if (!s){ ok = false; break; }
        score += s;
      }
      if (ok) scored.push([score, d]);
    }
    scored.sort((a, b) => b[0] - a[0]);
    count.textContent = scored.length + ' result' + (scored.length === 1 ? '' : 's');
    for (const [, d] of scored.slice(0, 50)){
      const li = document.createElement('li');
      const a = document.createElement('a'); a.href = d.u; a.textContent = d.t;
      const y = document.createElement('span'); y.className = 'dim'; y.textContent = ' (' + d.y + ')';
      li.appendChild(a); li.appendChild(y);
      const hit = ts.map(t => ({t, i: d.b.toLowerCase().indexOf(t)})).find(h => h.i >= 0);
      if (hit){
        const start = Math.max(0, hit.i - 70);
        const snip = document.createElement('p'); snip.className = 'snippet';
        snip.textContent = (start ? '…' : '') + d.b.slice(start, hit.i + 90) + '…';
        li.appendChild(snip);
      }
      results.appendChild(li);
    }
  }
  q.addEventListener('input', run);
  document.addEventListener('keydown', e => { if (e.key === '/' && e.target !== q){ e.preventDefault(); q.focus(); } });
})();
</script>

</main>

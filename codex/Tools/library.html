<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library - Character Database</title>
<script>
/* Theme, applied before first paint so there's no flash of the wrong one.
   The choice is remembered in localStorage - pure UI convenience, no world
   data, which is what GROUND-RULES rule 1 allows. The other tools read the
   same key, so the whole suite follows one setting. */
(function(){
  var pref = null;
  try{ pref = localStorage.getItem("cdb-theme"); }catch(e){}
  if(pref !== "light" && pref !== "dark") pref = null;   // null = follow system
  var dark = pref ? pref==="dark"
                  : !window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  /* the look (colour family) rides a second shared key; field is the default */
  var look = null;
  try{ look = localStorage.getItem("cdb-look"); }catch(e){}
  if(["atlas","board","iris","rose","slate"].indexOf(look) < 0) look = "field";
  document.documentElement.dataset.look = look;
})();
</script>

  :root[data-look="board"][data-theme="light"]{

    --line:#c5af85; --line-soft:#d7c7a6;
    --ink:#2e2822; --ink-dim:#5d5343; --ink-faint:#7c6e54;
    --accent:#6e5624; --accent-soft:#ecdfbc; --accent-line:#cab383;
    --accent-hover:#83682a; --on-accent:#fdf9ee; --btn-hover:#e7dabe;
    --shadow:rgba(70,55,30,.18);
  }
  :root[data-look="iris"]{
    --bg:#151218; --panel:#1d1924; --panel-2:#262030;
    --line:#383046; --line-soft:#2b2537;
    --ink:#e8e2f0; --ink-dim:#a79fb6; --ink-faint:#6f6880;
    --accent:#a78bdb; --accent-soft:#2c2344; --accent-line:#473a66;
    --accent-hover:#baa2e8; --on-accent:#170f26; --btn-hover:#2a2438;
  }
  :root[data-look="iris"][data-theme="light"]{
    --bg:#f2eef7; --panel:#fcfaff; --panel-2:#e7e0f0;
    --line:#cfc3e0; --line-soft:#ded4ea;
    --ink:#2b2438; --ink-dim:#5a5168; --ink-faint:#837a92;
    --accent:#6b4fa8; --accent-soft:#e6dcf5; --accent-line:#c3aee3;

  }

    --bg:#191214; --panel:#221a1d; --panel-2:#2c2226;
    --line:#443037; --line-soft:#332529;
    --ink:#eee0e4; --ink-dim:#b39ba3; --ink-faint:#7d6970;

    --accent-hover:#e29fb0; --on-accent:#260f16; --btn-hover:#2f2529;

    --bg:#f7eef0; --panel:#fffafb; --panel-2:#f0e1e5;
    --line:#ddc3ca; --line-soft:#ead5da;
    --ink:#35262b; --ink-dim:#645057; --ink-faint:#8f7a81;
    --accent:#a04360; --accent-soft:#f4dbe3; --accent-line:#dfadbd;
    --accent-hover:#b55573; --on-accent:#fff7f9; --btn-hover:#eddde1;
    --shadow:rgba(80,50,60,.18);
  }
  :root[data-look="slate"]{
    --bg:#10141a; --panel:#171d26; --panel-2:#1f2733;
    --line:#303c4d; --line-soft:#26303e;
    --ink:#dde4ee; --ink-dim:#94a1b4; --ink-faint:#627082;
    --accent:#6da7d8; --accent-soft:#16293c; --accent-line:#2a4a68;
    --accent-hover:#85b9e4; --on-accent:#06131f; --btn-hover:#232d3a;

  :root[data-look="slate"][data-theme="light"]{
    --bg:#e9edf2; --panel:#f7f9fc; --panel-2:#dde4ec;
    --line:#bcc8d6; --line-soft:#d2dae4;
    --ink:#27303b; --ink-dim:#4f5b6a; --ink-faint:#77828f;
    --accent:#2c6394; --accent-soft:#d9e7f3; --accent-line:#a5c4dd;

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:20;

  a.brand{display:block;color:var(--ink)}
  a.brand:hover{text-decoration:none;color:var(--accent)}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase}
  .brand{font-weight:650;letter-spacing:.2px}
  .grow{flex:1}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);display:inline-block}

  button{font:inherit;color:inherit}

    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);

  #viewBody .mchip.status{

  /* ---------- tool nav drawer ---------------------------------------------
     Identical markup, CSS and behaviour to every other tool; this page is
     marked and not a link. */
  .navbtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);

  #navScrim{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;

  }
  #navScrim.open{opacity:1;pointer-events:auto}
  #navDrawer{
    position:fixed;top:0;left:0;bottom:0;width:248px;z-index:301;
    background:var(--panel);border-right:1px solid var(--line);
    box-shadow:0 0 40px var(--shadow);
    transform:translateX(-101%);transition:transform .18s ease;
    display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto;

  #navDrawer.open{transform:none}

    color:var(--ink);font-size:14px;text-decoration:none;
  }
  #navDrawer a:hover{background:var(--btn-hover);text-decoration:none;color:var(--ink)}
  #navDrawer a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  #navDrawer span.navhere{background:var(--accent-soft);font-weight:600}
  #navDrawer .g{width:20px;text-align:center;color:var(--accent);font-size:15px;flex:none}
  #navDrawer .navfoot{
    margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line-soft);

  }
  @media (prefers-reduced-motion:reduce){
    #navDrawer,#navScrim{transition:none}
  }

<body>

<header>
  <button class="navbtn" id="btnNav" title="All tools" aria-label="All tools"><span></span><span></span><span></span></button>
  <a class="brand" href="index.html">Library<small>character database</small></a>

    <div class="empty" id="viewEmpty">

<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   LIBRARY - a read-only shelf of everything in the database.
   Reads the whole folder, groups entries by section on the left, and
   renders the selected file - facts panel + body - on the right.
   Writes nothing, ever. Editing happens in the writer; the "Open in
   writer" link on each entry goes straight there.
   ============================================================ */

const $ = id => document.getElementById(id);
const FS_OK = typeof window.showDirectoryPicker === "function";

// folders that hold scaffolding or generated output, not content
const SKIP_DIRS = new Set(["templates", "art", "site", "trash", "tools", ".git", ".obsidian"]);

const SECTION_ORDER = ["Characters","Locations","Factions","Stories","Events","World","Docs","Chat History"];

/* one colour per section - a reading aid, shown as a dot on the heading and
   a thin edge on each row. Same fixed hues in dark and light; anything not
   listed (a future folder) gets the neutral. */
const SECTION_COLORS = {
  Characters:"#a78bdb", Locations:"#7fa860", Factions:"#c96a4a",
  Stories:"#5b9bd5", Events:"#c9a227", World:"#4fb896",
  Docs:"#8f8878", "Chat History":"#8f8878"
};
const sectionColor = label => SECTION_COLORS[label] || "#8f8878";

/* An entry can carry its own `color:` in frontmatter, which wins over its
   section's colour. Everything below keeps that choice readable: whatever
   hex you pick, the ink drawn on top of it is pushed toward black or white
   until it clears 4.5:1, and tinted panels are mixed against the live
   background so they work in every theme and look. Same approach the world
   map already uses for region hulls. */
const isHex = v => /^#[0-9a-fA-F]{6}$/.test(String(v||"").trim());
const entryColor = e => (e && isHex(e.facts.color)) ? e.facts.color.trim() : sectionColor(e ? e.section : "");

function hexToRgb(h){
  h = h.replace("#","");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHex(r,g,b){
  const c = n => Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0");
  return "#" + c(r) + c(g) + c(b);
}
function mixHex(a, b, t){
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t);
}
function relLum(hex){
  const f = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const [r,g,b] = hexToRgb(hex).map(f);
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function contrast(a, b){
  const la = relLum(a), lb = relLum(b);
  return (Math.max(la,lb) + 0.05) / (Math.min(la,lb) + 0.05);
}
/* the live background, so mixes suit the current theme and look */
function liveVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return isHex(v) ? v : fallback;
}
/* nudge a colour toward black or white until it reads on `on` */
function readableInk(color, on){
  if(contrast(color, on) >= 4.5) return color;
  const dark = relLum(on) > 0.4;               // light surface -> darken the ink
  const target = dark ? "#000000" : "#ffffff";
  for(let t = 0.1; t <= 1.0001; t += 0.1){
    const c = mixHex(color, target, t);
    if(contrast(c, on) >= 4.5) return c;
  }
  return target;
}

/* drag-set ordering for the sidebar - which group comes first, and which
   entry comes first inside a group. Viewing convenience only, remembered in
   localStorage (GROUND-RULES rule 1). Anything not in a saved order - new
   sections, new entries - keeps its default alphabetical place. */
const SEC_ORDER_KEY = "cdb-libsecorder", ENTRY_ORDER_KEY = "cdb-libentryorder";
function loadOrder(key){
  try{ const a = JSON.parse(localStorage.getItem(key) || "null"); return Array.isArray(a) ? a : null; }
  catch(e){ return null; }
}
function loadEntryOrders(){
  try{ const o = JSON.parse(localStorage.getItem(ENTRY_ORDER_KEY) || "null"); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; }
  catch(e){ return {}; }
}
function saveKey(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
/* stable re-sort: saved items in saved order, everything else keeps its place */
function orderBy(list, saved, keyFn){
  if(!saved) return list;
  return list.slice().sort((a,b)=>{
    const sa = saved.indexOf(keyFn(a)), sb = saved.indexOf(keyFn(b));
    if(sa === -1 && sb === -1) return 0;
    if(sa === -1) return 1;
    if(sb === -1) return -1;
    return sa - sb;
  });
}
let dragSec = null, dragEnt = null;

const S = {
  root:null, saved:null,
  entries:[],            // every parsed .md
  byName:new Map(),      // lowercased entry name -> entry (for wikilink jumps)
  filter:"",
  selRel:null,           // rel path of the selected entry
  closedSecs:new Set(),  // collapsed sections (this visit only)
  closedStories:new Set() // story bibles whose chapters are folded
};

/* ---- remembering the folder --------------------------------------------
   Same shared IndexedDB entry every tool in the suite uses - a pointer to
   the folder, never anything from inside it (GROUND-RULES rule 1). */
const FOLDER_DB = "cdb-folder", FOLDER_STORE = "handles", FOLDER_KEY = "root";

function folderTx(mode){
  return new Promise((res,rej)=>{
    let rq;
    try{ rq = indexedDB.open(FOLDER_DB, 1); }catch(e){ rej(e); return; }
    rq.onupgradeneeded = ()=>rq.result.createObjectStore(FOLDER_STORE);
    rq.onerror = ()=>rej(rq.error);
    rq.onsuccess = ()=>{
      const db = rq.result, tx = db.transaction(FOLDER_STORE, mode);
      tx.oncomplete = ()=>db.close();
      res(tx.objectStore(FOLDER_STORE));
    };
  });
}
async function rememberFolder(handle){
  try{ (await folderTx("readwrite")).put(handle, FOLDER_KEY); }catch(e){}
}
async function recallFolder(){
  try{
    const store = await folderTx("readonly");
    return await new Promise(res=>{
      const q = store.get(FOLDER_KEY);
      q.onsuccess = ()=>res(q.result || null);
      q.onerror   = ()=>res(null);
    });
  }catch(e){ return null; }
}

/* ---- connecting ---------------------------------------------------------
   Read-only: the library never writes anything back. */

function setFolderUI(state, name){
  const dot = $("fsDot"), label = $("fsLabel");
  if(state === "on"){ dot.className = "dot on"; label.textContent = name; }
  else if(state === "stale"){ dot.className = "dot warn"; label.textContent = '"'+name+'" - reconnect'; }
  else { dot.className = "dot"; label.textContent = "connect folder"; }
}

async function useFolder(handle, quiet){
  let ok = false;
  try{ await handle.getDirectoryHandle("Characters"); ok = true; }catch(e){}
  if(!ok){
    if(!quiet) toast('No "Characters" folder in "'+handle.name+'". Pick the Character Database folder.', true);
    return false;
  }
  S.root = handle; S.saved = handle;
  rememberFolder(handle);
  setFolderUI("on", handle.name);
  await buildIndex();
  return true;
}

async function connectFolder(){
  if(!FS_OK){ toast("This browser can't open folders - use Chrome or Edge.", true); return; }

  if(S.saved && S.saved !== S.root){
    try{
      if(await S.saved.requestPermission({mode:"read"}) === "granted"){
        if(await useFolder(S.saved)) return;
      }
    }catch(e){}
  }

  try{
    await useFolder(await window.showDirectoryPicker({mode:"read"}));
  }catch(e){
    if(e && e.name === "AbortError") return;
    toast("Couldn't open the folder: " + (e && e.message), true);
  }
}

async function restoreFolder(){
  if(!FS_OK) return;
  const h = await recallFolder();
  if(!h) return;
  S.saved = h;
  let perm = "prompt";
  try{ perm = await h.queryPermission({mode:"read"}); }catch(e){}
  if(perm === "granted" && await useFolder(h, true)) return;
  setFolderUI("stale", h.name);
}

/* ============================================================
   INDEXING - the same plain recursive walk search.html does. A new
   top-level folder shows up as its own section with no code change.
   ============================================================ */

async function walk(dir, pathParts, out){
  for await (const [name, handle] of dir.entries()){
    if(handle.kind === "directory"){
      if(SKIP_DIRS.has(name.toLowerCase())) continue;
      await walk(handle, pathParts.concat(name), out);
    } else if(/\.md$/i.test(name) && !name.startsWith("_")){
      const text = await (await handle.getFile()).text();
      out.push({ rel: pathParts.concat(name).join("/"), name, text });
    }
  }
}

function sectionFor(pathParts){
  const top = pathParts[0] || "";
  if(pathParts.length === 0) return "Docs";           // root-level .md
  if(top === "World"){
    if(pathParts[1] === "Locations") return "Locations";
    if(pathParts[1] === "Factions") return "Factions";
    return "World";                                    // Regions.md, Calendar.md
  }
  if(top === "Claude Chat History") return "Chat History";
  return top;                                          // Characters, Stories, Events, future folders
}

const WRITER_TYPE = { Characters:"character", Locations:"location", Factions:"faction", Stories:"story", Events:"event" };

function parseFile(f){
  const parts = f.rel.split("/");
  parts.pop();
  const section = sectionFor(parts);

  const e = {
    section, filename: f.name, rel: f.rel, pathParts: parts,
    name: f.name.replace(/\.md$/i, ""),
    status:"", updated:"", tags:[], tagline:"", facts:{},
    body:"", raw:f.text,
    isChapter: section === "Stories" && parts.length > 1,
    storyFolder: section === "Stories" && parts.length > 1 ? parts[1] : null
  };

  const fm = f.text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  if(fm){
    fm[1].split(/\r?\n/).forEach(line=>{
      const m = line.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
      if(!m) return;
      const key = m[1], val = m[2].trim().replace(/^["']|["']$/g, "");
      if(key === "status"){ e.status = val; return; }
      if(key === "updated"){ e.updated = val; return; }
      if(key === "name"){ if(val) e.name = val; return; }
      if(key === "tags"){
        if(val) e.tags = val.replace(/^\[|\]$/g, "").split(",")
          .map(t=>t.trim().replace(/^["']|["']$/g, "")).filter(Boolean);
        return;
      }
      if(val) e.facts[key] = val;
    });
  }

  const body = fm ? f.text.slice(fm[0].length) : f.text;
  e.body = body.trim();
  const tag = body.match(/^>\s?(.+)$/m);
  if(tag) e.tagline = tag[1].trim();

  /* aliases let one entry answer to more than one name, so [[an alias]]
     written elsewhere still resolves here instead of showing as unwritten */
  e.aliases = e.facts.aliases ? cleanFactValue(e.facts.aliases) : [];

  const type = WRITER_TYPE[section];
  e.writerHref = type && !e.isChapter
    ? "character-writer.html#type="+type+"&mode=form&open="+encodeURIComponent(f.name)
    : null;
  e.manuscriptHref = e.isChapter
    ? "manuscript.html#story=" + encodeURIComponent(e.storyFolder + ".md")
    : null;

  return e;
}

async function buildIndex(){
  const files = [];
  await walk(S.root, [], files);
  S.entries = files.map(parseFile);

  S.byName = new Map();
  S.entries.forEach(e=>{
    S.byName.set(e.name.toLowerCase(), e);
    S.byName.set(e.filename.replace(/\.md$/i,"").toLowerCase(), e);
    /* setdefault, not set - a real entry's own name always wins over
       someone else's alias for it */
    (e.aliases||[]).forEach(a=>{
      const k = String(a).toLowerCase();
      if(k && !S.byName.has(k)) S.byName.set(k, e);
    });
  });

  $("filter").disabled = false;
  renderSide();

  // deep link: #open=<rel path>, else keep the current selection if it survived
  const want = hashRel();
  if(want && S.entries.some(e=>e.rel === want)) select(want, true);
  else if(S.selRel && S.entries.some(e=>e.rel === S.selRel)) select(S.selRel, true);
  else renderView();
}

function hashRel(){
  const m = location.hash.match(/open=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

/* ============================================================
   SIDEBAR
   ============================================================ */

function matchesFilter(e, q){
  if(!q) return true;
  const hay = (e.name + " " + e.tags.join(" ") + " " + e.status).toLowerCase();
  return q.split(/\s+/).every(t => hay.includes(t));
}

function renderSide(){
  const wrap = $("lists"); wrap.textContent = "";
  const q = S.filter.trim().toLowerCase();

  const bySection = new Map();
  S.entries.forEach(e=>{
    if(!matchesFilter(e, q)) return;
    if(!bySection.has(e.section)) bySection.set(e.section, []);
    bySection.get(e.section).push(e);
  });

  let labels = [...bySection.keys()].sort((a,b)=>{
    const ia = SECTION_ORDER.indexOf(a), ib = SECTION_ORDER.indexOf(b);
    if(ia === -1 && ib === -1) return a.localeCompare(b);
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
  labels = orderBy(labels, loadOrder(SEC_ORDER_KEY), x=>x);

  if(!labels.length){
    const d = document.createElement("div");
    d.className = "sideempty";
    d.textContent = q ? "Nothing matches that filter." : "Nothing written yet - the writer is where entries are born.";
    wrap.appendChild(d);
    return;
  }

  labels.forEach(label=>{
    const sec = document.createElement("div"); sec.className = "sec";
    const filtering = !!q;                       // a filter overrides folding
    const closed = !filtering && S.closedSecs.has(label);

    const h = document.createElement("h2");
    if(closed) h.classList.add("closed");
    const ar = document.createElement("span"); ar.className = "arrow"; ar.textContent = "▾";
    const dot = document.createElement("span"); dot.className = "dot2";
    dot.style.background = sectionColor(label);
    const lbl = document.createElement("span"); lbl.textContent = label;
    const n = document.createElement("span"); n.className = "n";
    n.textContent = bySection.get(label).length;
    h.append(ar, dot, lbl, n);
    h.onclick = ()=>{
      if(S.closedSecs.has(label)) S.closedSecs.delete(label);
      else S.closedSecs.add(label);
      renderSide();
    };
    if(!filtering){
      h.draggable = true;
      h.title = "Click to fold - drag to move the group";
      h.addEventListener("dragstart", ev=>{
        dragSec = label;
        ev.dataTransfer.effectAllowed = "move";
        try{ ev.dataTransfer.setData("text/plain", label); }catch(err){}
      });
      h.addEventListener("dragover", ev=>{ if(dragSec && dragSec !== label) ev.preventDefault(); });
      h.addEventListener("drop", ev=>{
        ev.preventDefault();
        if(!dragSec || dragSec === label) return;
        const cur = labels.slice();
        const from = cur.indexOf(dragSec), to = cur.indexOf(label);
        if(from < 0 || to < 0) return;
        cur.splice(to, 0, cur.splice(from, 1)[0]);
        (loadOrder(SEC_ORDER_KEY) || []).forEach(l=>{ if(!cur.includes(l)) cur.push(l); });
        saveKey(SEC_ORDER_KEY, cur);
        dragSec = null;
        renderSide();
      });
      h.addEventListener("dragend", ()=>{ dragSec = null; });
    }
    sec.appendChild(h);

    let items = bySection.get(label);
    const savedEntries = loadEntryOrders()[label] || null;
    let topOrder;                       // display order of draggable rows' rels
    if(label === "Stories"){
      /* bibles first, each followed by its own chapters, indented - the
         chapter's folder name matches the bible's filename, per
         Stories/_about.md. Drag ordering applies to the bibles; chapters
         travel with their story and keep chapter-number order. */
      let bibles = items.filter(e=>!e.isChapter).sort((a,b)=>a.name.localeCompare(b.name));
      bibles = orderBy(bibles, savedEntries, x=>x.rel);
      const chapters = items.filter(e=>e.isChapter);
      const ordered = [];
      bibles.forEach(b=>{
        ordered.push(b);
        chapters.filter(c=>c.storyFolder === b.filename.replace(/\.md$/i,""))
          .sort((a,b)=>{
            const na = parseFloat(a.facts.chapter), nb = parseFloat(b.facts.chapter);
            if(!isNaN(na) && !isNaN(nb)) return na - nb;
            return a.name.localeCompare(b.name);
          })
          .forEach(c=>ordered.push(c));
      });
      // chapters whose bible didn't match the filter (or doesn't exist) still show
      chapters.filter(c=>!ordered.includes(c)).forEach(c=>ordered.push(c));
      items = ordered;
      topOrder = bibles.map(x=>x.rel);
    } else {
      items = orderBy(items.slice().sort((a,b)=>a.name.localeCompare(b.name)), savedEntries, x=>x.rel);
      topOrder = items.map(x=>x.rel);
    }

    const hasChapters = new Set();
    if(label === "Stories") items.forEach(e=>{ if(e.isChapter) hasChapters.add(e.storyFolder); });

    items.forEach(e=>{
      if(closed) return;
      /* chapters fold away under their story's own arrow */
      const bibleKey = e.filename.replace(/\.md$/i, "");
      if(!filtering && e.isChapter && S.closedStories.has(e.storyFolder)) return;

      const b = document.createElement("button");
      b.className = "item" + (e.isChapter ? " chapter" : "") + (e.rel === S.selRel ? " sel" : "");
      b.type = "button";
      b.style.borderLeft = "2px solid " + entryColor(e) + (e.isChapter ? "55" : "");
      b.style.borderRadius = "0 7px 7px 0";

      if(label === "Stories" && !e.isChapter && hasChapters.has(bibleKey)){
        const fold = document.createElement("span");
        fold.className = "fold" + (S.closedStories.has(bibleKey) ? " closed" : "");
        fold.textContent = "▾";
        fold.title = "Show or hide chapters";
        fold.onclick = ev=>{
          ev.stopPropagation();
          if(S.closedStories.has(bibleKey)) S.closedStories.delete(bibleKey);
          else S.closedStories.add(bibleKey);
          renderSide();
        };
        b.appendChild(fold);
      }

      const nm = document.createElement("span");
      nm.textContent = e.isChapter && e.facts.chapter ? "Ch. " + e.facts.chapter + " - " + (e.facts.title || e.name) : e.name;
      b.appendChild(nm);
      if(e.status){
        const st = document.createElement("span"); st.className = "st"; st.textContent = e.status;
        b.appendChild(st);
      }
      b.onclick = ()=>select(e.rel);

      /* drag an entry onto another in the same group to reorder them;
         chapters stay glued to their story so they don't drag */
      if(!filtering && !e.isChapter){
        b.draggable = true;
        b.addEventListener("dragstart", ev=>{
          dragEnt = { label, rel: e.rel };
          ev.dataTransfer.effectAllowed = "move";
          try{ ev.dataTransfer.setData("text/plain", e.rel); }catch(err){}
        });
        b.addEventListener("dragover", ev=>{
          if(dragEnt && dragEnt.label === label && dragEnt.rel !== e.rel) ev.preventDefault();
        });
        b.addEventListener("drop", ev=>{
          ev.preventDefault(); ev.stopPropagation();
          if(!dragEnt || dragEnt.label !== label || dragEnt.rel === e.rel) return;
          const rels = topOrder.slice();
          const from = rels.indexOf(dragEnt.rel), to = rels.indexOf(e.rel);
          if(from < 0 || to < 0) return;
          rels.splice(to, 0, rels.splice(from, 1)[0]);
          const all = loadEntryOrders();
          all[label] = rels;
          saveKey(ENTRY_ORDER_KEY, all);
          dragEnt = null;
          renderSide();
        });
        b.addEventListener("dragend", ()=>{ dragEnt = null; });
      }
      sec.appendChild(b);
    });

    wrap.appendChild(sec);
  });
}

/* ============================================================
   READING PANE
   ============================================================ */

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* wikilinks render as clickable spans; clicking one jumps to that entry in
   the library if a file for it exists, and explains itself if not */
function inline(s){
  return esc(s)
    .replace(/!?\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, label)=>{
      const known = S.byName.has(target.trim().toLowerCase());
      return '<span class="wl'+(known?'':' dead')+'" data-wl="'+esc(target.trim())+'">'+esc(label||target)+"</span>";
    })
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>");
}

function renderMd(src){
  const out = [];
  let inCode = false, listType = null, inTable = false, headerRow = false;

  const closeList = ()=>{
    if(listType){ out.push("</"+listType+">"); listType=null; }
    if(inTable){ out.push("</table>"); inTable=false; }
  };

  for(const raw of src.split(/\r?\n/)){
    if(/^```/.test(raw)){
      closeList();
      out.push(inCode ? "</code></pre>" : "<pre><code>");
      inCode = !inCode;
      continue;
    }
    if(inCode){ out.push(esc(raw)); continue; }

    const line = raw.trimEnd();
    if(!line.trim()){ closeList(); continue; }

    if(/^\s*\|.*\|\s*$/.test(line)){
      if(/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue;
      if(listType){ out.push("</"+listType+">"); listType=null; }
      if(!inTable){ out.push("<table>"); inTable=true; headerRow=true; }
      const tag = headerRow ? "th" : "td"; headerRow = false;
      const cells = line.trim().replace(/^\||\|$/g,"").split("|")
        .map(c=>"<"+tag+">"+inline(c.trim())+"</"+tag+">");
      out.push("<tr>"+cells.join("")+"</tr>");
      continue;
    }

    let m;
    if((m = line.match(/^(#{1,4})\s+(.*)$/))){
      closeList();
      const lvl = m[1].length;
      out.push("<h"+lvl+">"+inline(m[2])+"</h"+lvl+">");
      continue;
    }
    if(/^-{3,}\s*$/.test(line)){ closeList(); out.push("<hr>"); continue; }
    if((m = line.match(/^>\s?(.*)$/))){
      closeList();
      out.push("<blockquote>"+inline(m[1])+"</blockquote>");
      continue;
    }
    if((m = line.match(/^\s*[-*]\s*\[([ xX])\]\s+(.*)$/))){
      if(listType !== "ul"){ closeList(); out.push("<ul>"); listType="ul"; }
      const checked = m[1].toLowerCase()==="x";
      out.push("<li><input type=\"checkbox\" disabled"+(checked?" checked":"")+"> "+inline(m[2])+"</li>");
      continue;
    }
    if((m = line.match(/^\s*[-*]\s+(.*)$/))){
      if(listType !== "ul"){ closeList(); out.push("<ul>"); listType="ul"; }
      out.push("<li>"+inline(m[1])+"</li>");
      continue;
    }
    if((m = line.match(/^\s*\d+\.\s+(.*)$/))){
      if(listType !== "ol"){ closeList(); out.push("<ol>"); listType="ol"; }
      out.push("<li>"+inline(m[1])+"</li>");
      continue;
    }
    closeList();
    out.push("<p>"+inline(line)+"</p>");
  }
  closeList();
  return out.join("\n");
}

// a fact's raw value might be a flow-style list - strip the punctuation
function cleanFactValue(v){
  return String(v)
    .replace(/^\[|\]$/g, "")
    .split(",")
    .map(s=>s.trim().replace(/^[\[\]"']+|[\[\]"']+$/g,""))
    .filter(Boolean);
}

const FACT_SKIP = new Set(["name","status","updated","created","tags","art_folder","main_ref","map_x","map_y","word_count","color","aliases"]);

function select(rel, quiet){
  S.selRel = rel;
  const e = S.entries.find(x=>x.rel === rel);
  if(!e) return;
  if(!quiet){
    // keep the address bar in sync so a reload or bookmark comes back here
    history.replaceState(null, "", "#open=" + encodeURIComponent(rel));
  }
  renderSide();
  renderView();
  $("view").scrollIntoView({block:"start"});
  window.scrollTo({top:0});
}

async function portraitFor(e, img){
  /* main_ref, or the first image loose in art_folder - same lookup order the
     dashboard uses. Read-only; failures just mean no portrait. */
  if(!S.root) return;
  try{
    let path = e.facts.main_ref;
    if(!path && e.facts.art_folder){
      let dir = S.root;
      for(const p of e.facts.art_folder.replace(/\/+$/,"").split("/")) dir = await dir.getDirectoryHandle(p);
      for await (const [n,h] of dir.entries()){
        if(h.kind==="file" && /\.(png|jpe?g|webp|gif)$/i.test(n)){ path = e.facts.art_folder.replace(/\/+$/,"") + "/" + n; break; }
      }
    }
    if(!path) return;
    let fh = S.root;
    const parts = path.split("/");
    for(let i=0;i<parts.length-1;i++) fh = await fh.getDirectoryHandle(parts[i]);
    fh = await fh.getFileHandle(parts[parts.length-1]);
    const url = URL.createObjectURL(await fh.getFile());
    img.src = url; img.hidden = false;
  }catch(err){ /* no art is normal */ }
}

function renderView(){
  const body = $("viewBody"), empty = $("viewEmpty");
  const e = S.entries.find(x=>x.rel === S.selRel);
  if(!e){
    body.hidden = true; empty.hidden = false;
    if(S.entries.length){
      empty.innerHTML = "<b>" + S.entries.length + " files</b> on the shelf. Pick one on the left.";
    }
    return;
  }
  empty.hidden = true; body.hidden = false;
  body.textContent = "";

  /* this entry's colour - its own if set, otherwise its section's */
  const col = entryColor(e);
  const own = isHex(e.facts.color);
  const bg = liveVar("--bg", "#14120f");
  const panel = liveVar("--panel", "#1c1a16");
  const ink = readableInk(col, bg);            // safe for text on the page
  const band = mixHex(col, panel, 0.86);       // a whisper of tint, not a slab

  const crumb = document.createElement("p"); crumb.className = "crumb";
  const cdot = document.createElement("span");
  cdot.style.cssText = "display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:" + col;
  crumb.appendChild(cdot);
  crumb.appendChild(document.createTextNode(e.rel));
  body.appendChild(crumb);

  /* the whole pane leans on the entry's colour, but only through variables
     that are already contrast-checked above */
  body.style.setProperty("--e-col", col);
  body.style.setProperty("--e-ink", ink);
  body.style.setProperty("--e-band", band);
  body.dataset.own = own ? "1" : "0";

  const h1 = document.createElement("h1"); h1.className = "title serif";
  h1.textContent = e.name;
  h1.style.color = "var(--e-ink)";
  body.appendChild(h1);

  if(e.tagline){
    const t = document.createElement("p"); t.className = "tagline";
    t.textContent = e.tagline;
    body.appendChild(t);
  }

  const chips = document.createElement("div"); chips.className = "metachips";
  if(e.status){
    const c = document.createElement("span"); c.className = "mchip status"; c.textContent = e.status;
    chips.appendChild(c);
  }
  (e.aliases||[]).forEach(a=>{
    const c = document.createElement("span"); c.className = "mchip";
    c.textContent = "aka " + a; c.title = "Also known as - links using this name resolve here";
    chips.appendChild(c);
  });
  e.tags.forEach(tag=>{
    const c = document.createElement("span"); c.className = "mchip"; c.textContent = tag;
    chips.appendChild(c);
  });
  if(e.updated){
    const c = document.createElement("span"); c.className = "mchip"; c.textContent = "updated " + e.updated;
    chips.appendChild(c);
  }
  if(chips.children.length) body.appendChild(chips);

  if(e.section === "Characters"){
    const img = document.createElement("img");
    img.className = "portrait"; img.alt = ""; img.hidden = true;
    body.appendChild(img);
    portraitFor(e, img);
  }

  const factRows = Object.entries(e.facts)
    .filter(([k])=>!FACT_SKIP.has(k))
    .filter(([,v])=>cleanFactValue(v).length);   // "[]" and "" rows say nothing
  if(factRows.length){
    const box = document.createElement("div"); box.className = "facts";
    const table = document.createElement("table");
    factRows.forEach(([k,v])=>{
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.className = "k"; td1.textContent = k.replace(/_/g," ");
      const td2 = document.createElement("td"); td2.className = "v";
      cleanFactValue(v).forEach((val,i)=>{
        if(i) td2.appendChild(document.createTextNode(", "));
        const known = S.byName.has(val.toLowerCase());
        if(known){
          const sp = document.createElement("span");
          sp.className = "wl"; sp.dataset.wl = val; sp.textContent = val;
          td2.appendChild(sp);
        } else {
          td2.appendChild(document.createTextNode(val));
        }
      });
      tr.append(td1, td2);
      table.appendChild(tr);
    });
    box.appendChild(table);
    body.appendChild(box);
  }

  /* every entry gets an edit route: the writer for the five entry types,
     the manuscript pane for chapters, and a raw markdown editor here for
     everything else (docs, chat history, Regions.md, Calendar.md). Chapters
     get the raw editor too, for quick fixes without switching tools. */
  const actions = document.createElement("p"); actions.className = "openwriter";
  if(e.writerHref){
    const a = document.createElement("a"); a.href = e.writerHref; a.textContent = "✎ Edit in writer →";
    actions.appendChild(a);
  }
  if(e.manuscriptHref){
    const a = document.createElement("a"); a.href = e.manuscriptHref; a.textContent = "¶ Open in manuscript →";
    actions.appendChild(a);
  }
  if(!e.writerHref){
    const b = document.createElement("button"); b.className = "btn"; b.type = "button";
    b.textContent = "✎ Edit here";
    b.onclick = ()=>rawEditor(e);
    actions.appendChild(b);
  }
  body.appendChild(actions);

  const md = document.createElement("div"); md.className = "md";
  /* drop the H1 the file opens with - the pane already shows the title */
  const src = e.body.replace(/^#\s+.*\r?\n/, "");
  md.innerHTML = renderMd(src);
  body.appendChild(md);
}

/* ---- raw editor -----------------------------------------------------------
   For files the writer has no form for. A plain textarea over the exact
   file text - nothing reformatted, nothing added. The folder was connected
   read-only, so Save asks the browser to upgrade to write access right
   there (the click counts as the user gesture browsers require). */

async function writeBack(rel, text){
  let perm = "prompt";
  try{ perm = await S.root.queryPermission({mode:"readwrite"}); }catch(e){}
  if(perm !== "granted"){
    try{ perm = await S.root.requestPermission({mode:"readwrite"}); }catch(e){ perm = "denied"; }
  }
  if(perm !== "granted") throw new Error("write access not granted");
  const parts = rel.split("/");
  let dir = S.root;
  for(let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i]);
  const fh = await dir.getFileHandle(parts[parts.length - 1]);
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
}

function rawEditor(e){
  const body = $("viewBody");
  const md = body.querySelector(".md");
  const actions = body.querySelector(".openwriter");
  if(!md || body.querySelector(".raweditor")) return;
  md.hidden = true; if(actions) actions.hidden = true;

  const ed = document.createElement("div"); ed.className = "raweditor";
  const ta = document.createElement("textarea");
  ta.value = e.raw;
  ta.spellcheck = false;
  const row = document.createElement("div"); row.className = "row";
  const save = document.createElement("button"); save.className = "btn"; save.textContent = "Save";
  const cancel = document.createElement("button"); cancel.className = "btn"; cancel.textContent = "Cancel";
  const note = document.createElement("span"); note.className = "note";
  note.textContent = "The exact file text - frontmatter included. Mind ground rule 3: keep the YAML valid.";
  row.append(save, cancel, note);
  ed.append(ta, row);
  body.appendChild(ed);
  ta.focus();

  let busy = false;
  cancel.onclick = ()=>{ if(!busy) renderView(); };
  save.onclick = async ()=>{
    if(busy) return;
    busy = true; save.textContent = "Saving…";
    try{
      await writeBack(e.rel, ta.value);
      /* refresh this entry in place from what was just written */
      const fresh = parseFile({rel:e.rel, name:e.filename, text:ta.value});
      const i = S.entries.findIndex(x=>x.rel === e.rel);
      if(i >= 0) S.entries[i] = fresh;
      S.byName = new Map();
      S.entries.forEach(x=>{
        S.byName.set(x.name.toLowerCase(), x);
        S.byName.set(x.filename.replace(/\.md$/i,"").toLowerCase(), x);
        (x.aliases||[]).forEach(a=>{
          const k = String(a).toLowerCase();
          if(k && !S.byName.has(k)) S.byName.set(k, x);
        });
      });
      renderSide(); renderView();
      toast("Saved " + e.filename);
    }catch(err){
      busy = false; save.textContent = "Save";
      toast("Couldn't save: " + (err && err.message), true);
    }
  };

  const kd = ev=>{
    if((ev.ctrlKey || ev.metaKey) && ev.key === "s"){ ev.preventDefault(); save.onclick(); }
  };
  ta.addEventListener("keydown", kd);
}

/* wikilink clicks anywhere in the pane jump within the library */
$("view").addEventListener("click", ev=>{
  const wl = ev.target.closest(".wl");
  if(!wl) return;
  const target = wl.dataset.wl;
  if(!target) return;
  const e = S.byName.get(target.toLowerCase());
  if(e) select(e.rel);
  else toast('No file for "'+target+'" yet - it\'s only a link so far.');
});

/* ---- resizable sidebar ----------------------------------------------------
   Drag the strip between the shelf and the page to set how wide the shelf
   is; double-click it to go back to the default. The width is remembered in
   localStorage - viewing convenience only, nothing about the world. */
(function(){
  const grip = $("sideGrip");
  const KEY = "cdb-libwidth";
  function apply(px){
    px = Math.max(180, Math.min(560, px));
    document.documentElement.style.setProperty("--sidew", px + "px");
    return px;
  }
  let saved = null;
  try{ saved = parseInt(localStorage.getItem(KEY), 10); }catch(e){}
  if(saved) apply(saved);

  grip.onmousedown = e=>{
    e.preventDefault();
    grip.classList.add("on");
    const startX = e.clientX;
    const startW = $("side").getBoundingClientRect().width;
    let cur = startW;
    const move = ev=>{ cur = apply(startW + (ev.clientX - startX)); };
    const up = ()=>{
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      grip.classList.remove("on");
      try{ localStorage.setItem(KEY, String(Math.round(cur))); }catch(e){}
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  };
  grip.ondblclick = ()=>{
    document.documentElement.style.removeProperty("--sidew");
    try{ localStorage.removeItem(KEY); }catch(e){}
  };
})();

/* ---------- misc ----------------------------------------------------------- */

let toastTimer = null;
function toast(msg, bad){
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = ""; }, 4200);
}

/* ---------- theme --------------------------------------------------------- */

const SYSTEM_LIGHT = window.matchMedia("(prefers-color-scheme: light)");
const THEME_ICON = { system:"◐", dark:"☾", light:"☀" };
const THEME_TITLE = { system:"Theme: follows your system", dark:"Theme: dark", light:"Theme: light" };

function themePref(){
  try{ const v = localStorage.getItem("cdb-theme"); return (v==="light"||v==="dark") ? v : "system"; }
  catch(e){ return "system"; }
}
function applyTheme(pref){
  const dark = pref === "system" ? !SYSTEM_LIGHT.matches : pref === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("btnTheme").textContent = THEME_ICON[pref];
  $("btnTheme").title = THEME_TITLE[pref] + " - click to change";
}
$("btnTheme").onclick = ()=>{
  /* Flip to the opposite of what's actually on screen. The old
     system -> dark -> light cycle spent a click doing nothing visible: on a
     machine whose OS is dark, "follow system" and "dark" render identically,
     so reaching light took two clicks while returning took one. Following the
     system is still selectable from the dashboard's settings, which lists all
     three explicitly. */
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try{ if(next === "system") localStorage.removeItem("cdb-theme"); else localStorage.setItem("cdb-theme", next); }
  catch(e){}
  applyTheme(next);
};
SYSTEM_LIGHT.addEventListener("change", ()=>{ if(themePref() === "system") applyTheme("system"); });
window.addEventListener("storage", e=>{
  if(e.key === null || e.key === "cdb-look"){
    let look = null;
    try{ look = localStorage.getItem("cdb-look"); }catch(err){}
    document.documentElement.dataset.look = (["atlas","board","iris","rose","slate"].indexOf(look) >= 0) ? look : "field";
  }
  if(e.key === null || e.key === "cdb-theme" || e.key === "cdb-look") applyTheme(themePref());
});
applyTheme(themePref());

/* ---------- wiring ---------------------------------------------------------- */

$("btnConnect").onclick = connectFolder;

let filterTimer = null;
$("filter").oninput = ()=>{
  S.filter = $("filter").value;
  clearTimeout(filterTimer);
  filterTimer = setTimeout(renderSide, 80);
};

document.addEventListener("keydown", e=>{
  if(e.key === "/" && document.activeElement !== $("filter")){
    e.preventDefault(); $("filter").focus();
  }
});

window.addEventListener("hashchange", ()=>{
  const want = hashRel();
  if(want && S.entries.some(x=>x.rel === want)) select(want, true);
});

if(!FS_OK){ $("fsDot").className = "dot warn"; $("fsLabel").textContent = "unsupported browser"; }
else restoreFolder();

/* ============================================================
   TOOL NAV DRAWER
   ============================================================
   The three-line button in the header opens a list of every tool. Pure
   navigation: it stores nothing and reads nothing from the database folder,
   so it works before a folder is ever connected.

   NAV_TOOLS is repeated in each tool on purpose - these pages are standalone
   by design, with no build step and no shared runtime. Adding a tool later is
   one line here, in each file.
   ============================================================ */
const NAV_TOOLS = [
  {g:"⌂", label:"Home",        href:"index.html"},
  {g:"✎", label:"Writer",      href:"character-writer.html"},
  {g:"▤", label:"Library",     href:"library.html"},
  {g:"⁂", label:"Family tree", href:"family-tree.html"},
  {g:"◎", label:"World map",   href:"world-map.html"},
  {g:"¶", label:"Manuscript",  href:"manuscript.html"},
  {g:"▣", label:"Art board",   href:"art-board.html"},
  {g:"⌕", label:"Search",      href:"search.html"},
  {g:"◷", label:"Timeline",    href:"timeline.html"}
];
const NAV_HERE = "library.html";
/* This page lives in Tools/; the dashboard is one level up. NAV_TOOLS
   entries keep the bare filename as their stable id (the saved order is
   keyed on it), and these two turn an id into a link from here. */
const NAV_BASE = "";
const NAV_HOME = "../index.html";

(function(){
  const btn = document.getElementById("btnNav");
  if(!btn) return;

  const scrim = document.createElement("div");
  scrim.id = "navScrim";

  const drawer = document.createElement("nav");
  drawer.id = "navDrawer";
  drawer.setAttribute("aria-label", "Tools");

  const h = document.createElement("h2");
  h.textContent = "Tools";
  drawer.appendChild(h);

  /* The list order is yours - drag a row to move it. The order rides one
     shared localStorage key so every tool shows the same list (pure UI
     convenience, no world data - GROUND-RULES rule 1). A tool missing from
     the saved order - a future new one - keeps its default place. */
  const NAV_ORDER_KEY = "cdb-navorder";
  function navOrder(){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(NAV_ORDER_KEY) || "null"); }catch(e){}
    if(!Array.isArray(saved)) return NAV_TOOLS.slice();
    const byHref = new Map(NAV_TOOLS.map(t=>[t.href, t]));
    const out = [];
    saved.forEach(href=>{ const t = byHref.get(href); if(t){ out.push(t); byHref.delete(href); } });
    NAV_TOOLS.forEach(t=>{ if(byHref.has(t.href)) out.push(t); });
    return out;
  }
  function saveOrder(list){
    try{ localStorage.setItem(NAV_ORDER_KEY, JSON.stringify(list.map(t=>t.href))); }catch(e){}
  }

  const foot = document.createElement("div");
  foot.className = "navfoot";
  foot.textContent = "Drag a row to reorder - every tool follows. They all read the same folder: connect it once and they remember it.";

  let dragHref = null;
  function renderNav(){
    [...drawer.querySelectorAll("a, span.navhere")].forEach(el=>el.remove());
    navOrder().forEach(t=>{
      const here = t.href === NAV_HERE;
      const el = document.createElement(here ? "span" : "a");
      if(here){ el.className = "navhere"; el.setAttribute("aria-current","page"); }
      else { el.href = t.href === "index.html" ? NAV_HOME : NAV_BASE + t.href; }
      const g = document.createElement("span"); g.className = "g"; g.textContent = t.g;
      const s = document.createElement("span"); s.textContent = t.label;
      el.append(g, s);
      el.draggable = true;
      el.title = "Drag to reorder";
      el.addEventListener("dragstart", e=>{
        dragHref = t.href;
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", t.href); }catch(err){}
      });
      el.addEventListener("dragover", e=>{ if(dragHref && dragHref !== t.href) e.preventDefault(); });
      el.addEventListener("drop", e=>{
        e.preventDefault();
        if(!dragHref || dragHref === t.href) return;
        const cur = navOrder();
        const from = cur.findIndex(x=>x.href === dragHref);
        const to = cur.findIndex(x=>x.href === t.href);
        if(from < 0 || to < 0) return;
        const moved = cur.splice(from, 1)[0];
        cur.splice(to, 0, moved);
        saveOrder(cur);
        dragHref = null;
        renderNav();
      });
      el.addEventListener("dragend", ()=>{ dragHref = null; });
      drawer.insertBefore(el, foot);
    });
  }

  drawer.appendChild(foot);
  renderNav();
  /* a reorder made in another open tab shows up here too */
  window.addEventListener("storage", e=>{
    if(e.key === null || e.key === NAV_ORDER_KEY) renderNav();
  });

  document.body.append(scrim, drawer);

  let open = false;
  function setNav(next){
    open = next;
    scrim.classList.toggle("open", open);
    drawer.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if(open){
      const first = drawer.querySelector("a");
      if(first) first.focus();
    } else {
      btn.focus();
    }
  }

  btn.setAttribute("aria-expanded","false");
  btn.onclick = e => { e.stopPropagation(); setNav(!open); };
  scrim.onclick = () => setNav(false);
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape" && open){ e.stopPropagation(); setNav(false); }
  }, true);
})();
</script>

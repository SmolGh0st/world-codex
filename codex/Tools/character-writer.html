/* ============================================================
   HELP BUBBLES
   ============================================================
   One "?" per field that carries a `guide`. Guided mode already shows that
   text one step at a time; form mode showed nothing, which is where "what
   does Section mean?" came from. Same words, same source, both modes.
   ============================================================ */

function closeHelpPop(){
  const p = document.getElementById("helpPop");
  if(p) p.remove();
}

function helpBubble(text, label){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "helpbub";
  b.textContent = "?";
  b.title = "What's this?";
  b.setAttribute("aria-label", "What is " + (label || "this field") + "?");
  b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const open = document.getElementById("helpPop");
    const same = open && open.dataset.for === text;
    closeHelpPop();
    if(same) return;                        // clicking the same bubble closes it
    const p = document.createElement("div");
    p.className = "helppop"; p.id = "helpPop"; p.dataset.for = text;
    p.textContent = text;
    document.body.appendChild(p);
    const r = b.getBoundingClientRect(), pad = 10;
    p.style.left = Math.max(pad, Math.min(r.left, window.innerWidth - p.offsetWidth - pad)) + "px";
    let top = r.bottom + 7;
    if(top + p.offsetHeight > window.innerHeight - pad) top = Math.max(pad, r.top - p.offsetHeight - 7);
    p.style.top = top + "px";
  };
  return b;
}

document.addEventListener("click", e=>{
  const p = document.getElementById("helpPop");
  if(p && !p.contains(e.target) && !e.target.closest(".helpbub")) closeHelpPop();
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeHelpPop(); });

/* ============================================================
   FIELD WIDGETS
   ============================================================ */

function fieldEl(f){
  const wrap = document.createElement("div");
  wrap.className = "f";
  const lab = document.createElement("label");
  lab.textContent = f.label + (f.required ? " *" : "");
  if(f.guide) lab.appendChild(helpBubble(f.guide, f.label));
  wrap.appendChild(lab);
  if(f.hint){
    const h = document.createElement("div"); h.className="hint"; h.textContent=f.hint; wrap.appendChild(h);
  }

  if(f.type === "select"){
    const sel = document.createElement("select");
    sel.className = "field";
    f.opts.forEach(o=>{
      const op = document.createElement("option"); op.value=o; op.textContent=o; sel.appendChild(op);
    });
    sel.value = S.data[f.k] || f.def || f.opts[0];
    sel.onchange = ()=>{ S.data[f.k]=sel.value; markDirty(); };
    wrap.appendChild(sel);
  }
  else if(f.type === "list" || f.type === "linklist"){
    wrap.appendChild(chipsEl(f));
  }
  else if(f.type === "color"){
    wrap.appendChild(colorEl(f));
  }
  else {
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = S.data[f.k] || "";
    if(f.type === "link") inp.placeholder = "name of a place or thing";
    inp.oninput = ()=>{
      S.data[f.k] = inp.value;
      if(f.k === "name") autoArt();
      markDirty();
    };
    if(f.type === "link") attachSuggest(inp, f, v=>{
      inp.value = v; S.data[f.k] = v; markDirty(); closeSuggest();
    });
    wrap.appendChild(inp);
    if(f.k === "main_ref") wrap.appendChild(portraitZone(inp));
  }
  return wrap;
}

/* ---- portrait drop zone -------------------------------------------------
   Rides under the main_ref field (form and guided mode both). Dropping or
   picking an image copies it into art_folder - Art/<slug>/ if that's blank -
   and points main_ref at it. The image is written immediately; main_ref
   itself still lands in the .md on Save, like any other field. Only
   web-ready formats are accepted, per GROUND-RULES rule 5. */
const IMG_RE = /\.(png|jpe?g|webp|gif)$/i;
let dzUrl = null;                 // last preview object URL, revoked on replace

function portraitZone(refInput){
  const zone = document.createElement("div");
  zone.className = "dropzone";
  zone.title = "Drop an image, or click to choose";
  const img = document.createElement("img"); img.alt = ""; img.hidden = true;
  const txt = document.createElement("span");
  zone.append(img, txt);

  const pick = document.createElement("input");
  pick.type = "file"; pick.accept = "image/png,image/jpeg,image/webp,image/gif";
  pick.hidden = true;
  zone.appendChild(pick);

  function setPreview(url){
    if(dzUrl) URL.revokeObjectURL(dzUrl);
    dzUrl = url;
    img.src = url; img.hidden = false;
  }

  async function showCurrent(){
    const rel = String(S.data.main_ref||"").trim();
    if(!rel){
      txt.innerHTML = "<b>Drop a portrait here</b>, or click to choose.<br>"+
                      "It's copied into the art folder and set as the reference.";
      return;
    }
    txt.innerHTML = "<b>"+esc(rel)+"</b><br>Drop a new image to replace the reference.";
    if(!S.rootHandle) return;
    try{
      let h = S.rootHandle;
      const parts = rel.replace(/\\/g,"/").split("/").filter(Boolean);
      const name = parts.pop();
      for(const p of parts) h = await h.getDirectoryHandle(p);
      setPreview(URL.createObjectURL(await (await h.getFileHandle(name)).getFile()));
    }catch(e){
      txt.innerHTML = "<b>"+esc(rel)+"</b><br>Not found in the folder - drop an image to add it.";
    }
  }

  async function take(file){
    if(!file) return;
    if(!IMG_RE.test(file.name)){
      toast("Use a web-ready image - .png, .jpg, .webp or .gif.", true); return;
    }
    if(!S.rootHandle){
      toast("Connect the folder first - without it the image can't be copied in.", true); return;
    }
    const rel = await writePortrait(file);
    if(!rel) return;
    S.data.main_ref = rel;
    refInput.value = rel;
    setPreview(URL.createObjectURL(file));
    txt.innerHTML = "<b>"+esc(rel)+"</b><br>Drop a new image to replace the reference.";
    markDirty();
    toast("Portrait saved to "+rel+" - Save to record it in the file.");
  }

  zone.onclick = ()=>pick.click();
  pick.onchange = ()=>{ take(pick.files[0]); pick.value = ""; };
  zone.ondragover = e=>{ e.preventDefault(); zone.classList.add("drag"); };
  zone.ondragleave = ()=>zone.classList.remove("drag");
  zone.ondrop = e=>{
    e.preventDefault(); zone.classList.remove("drag");
    take([...e.dataTransfer.files].find(f=>IMG_RE.test(f.name)) || e.dataTransfer.files[0]);
  };

  showCurrent();
  return zone;
}

async function writePortrait(file){
  let folder = String(S.data.art_folder||"").trim().replace(/\\/g,"/");
  if(!folder){
    const s = slug(S.data.name);
    if(!s){ toast("Give the character a name first - it decides the art folder.", true); return null; }
    folder = "Art/"+s+"/";
  }
  const clean = folder.replace(/^\/+|\/+$/g,"");
  const fname = file.name.replace(/[\\/:*?"<>|]/g,"-");
  try{
    let dir = S.rootHandle;
    for(const p of clean.split("/")) dir = await dir.getDirectoryHandle(p, {create:true});
    let exists = false;
    try{ await dir.getFileHandle(fname); exists = true; }catch(e){}
    if(exists && !confirm('"'+fname+'" already exists in '+clean+"/. Replace it?")) return null;
    const fh = await dir.getFileHandle(fname, {create:true});
    const w = await fh.createWritable();
    await w.write(file);
    await w.close();
  }catch(e){
    toast("Couldn't write the image: "+(e && e.message), true);
    return null;
  }
  // art_folder was blank or has drifted from where the image actually went -
  // record the folder that now holds the reference
  if(String(S.data.art_folder||"").trim().replace(/\\/g,"/").replace(/^\/+|\/+$/g,"") !== clean){
    S.data.art_folder = clean+"/";
    const el = document.querySelector('[data-fk="art_folder"] input');
    if(el) el.value = S.data.art_folder;
  }
  return clean+"/"+fname;
}

function autoArt(){
  if(S.type !== "character") return;
  const s = slug(S.data.name);
  const cur = S.data.art_folder || "";
  if(!cur || /^Art\/[a-z0-9-]*\/$/.test(cur)){
    S.data.art_folder = s ? "Art/"+s+"/" : "";
    const el = document.querySelector('[data-fk="art_folder"] input');
    if(el) el.value = S.data.art_folder;
  }
}

/* ---- suggestions - offer what already exists ----------------------------
   Link fields and the tag box get a dropdown of entries and tags already in
   the database, so "Vellhaven" doesn't become "Vellhavn" in one file and
   silently disconnect. The pool is read from the folder on connect and
   re-read after every save; it lives only in memory - nothing is stored
   anywhere (GROUND-RULES rule 1). Typing something new still works exactly
   as before: Enter keeps whatever you wrote.

   Keyboard: arrows move through the list, Enter takes the highlighted one,
   Esc closes. With nothing highlighted, Enter means "use my text as-is". */

const SUGGEST_SOURCES = [
  {kind:"character", path:["Characters"]},
  {kind:"location",  path:["World","Locations"]},
  {kind:"faction",   path:["World","Factions"]},
  {kind:"story",     path:["Stories"]},
  {kind:"event",     path:["Events"]}
];
/* which pools feed which field, by frontmatter key - one place to edit */
const SUGGEST_KINDS = {
  origin:["location"], parent_location:["location"], connections:["location"],
  base:["location"], locations:["location"],
  affiliations:["faction"], factions:["faction"], allies:["faction"], enemies:["faction"],
  stories:["story"], branched_from:["story"],
  notable_characters:["character"], members:["character"], characters:["character"], leader:["character"],
  involves:["character","location","faction"],
  tags:["tag"],
  __person:["character"],      // name columns in Relationships / Members / Cast tables
  __relation:["relation"]      // Relation column - the words the family tree can draw
};
const SUGGEST = { character:[], location:[], faction:[], story:[], event:[], tag:[],
  /* static: the standard vocabulary from ROADMAP.md - the family tree only
     draws rows using these words (plus common wordings). Free text still
     allowed for everything else ("rival", "owes her money"). */
  relation: ["parent","child","sibling","half-sibling","spouse",
             "adoptive parent","adoptive child","step-parent","step-child"]
};

async function scanSuggestions(){
  if(!S.rootHandle) return;
  const pools = { character:[], location:[], faction:[], story:[], event:[] };
  const tagCount = new Map();
  for(const src of SUGGEST_SOURCES){
    let dir = S.rootHandle, ok = true;
    try{ for(const p of src.path) dir = await dir.getDirectoryHandle(p); }catch(e){ ok = false; }
    if(!ok) continue;                       // folder not created yet - normal
    try{
      for await (const [n,h] of dir.entries()){
        if(h.kind !== "file" || !/\.md$/i.test(n) || n.startsWith("_")) continue;
        let name = n.replace(/\.md$/i, "");
        try{
          const text = await (await h.getFile()).text();
          const fm = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
          if(fm){
            const nm = fm[1].match(/^name:\s*(.+)$/m);
            if(nm){ const v = nm[1].trim().replace(/^["']|["']$/g, ""); if(v) name = v; }
            const tg = fm[1].match(/^tags:\s*(.+)$/m);
            if(tg) tg[1].trim().replace(/^\[|\]$/g, "").split(",")
              .map(t=>t.trim().replace(/^["']|["']$/g, "")).filter(Boolean)
              .forEach(t=>tagCount.set(t, (tagCount.get(t)||0) + 1));
          }
        }catch(e){}
        pools[src.kind].push(name);
      }
    }catch(e){}
  }
  for(const k in pools) SUGGEST[k] = pools[k].sort((a,b)=>a.localeCompare(b));
  SUGGEST.tag = [...tagCount.entries()].map(([v,n])=>({v,n}))
    .sort((a,b)=> b.n - a.n || a.v.localeCompare(b.v));
}

let sugPop = null, sugHot = -1, sugPick = null, sugKeepFocus = false;

function closeSuggest(){
  if(sugPop){ sugPop.remove(); sugPop = null; }
  sugHot = -1; sugPick = null; sugKeepFocus = false;
}

function sugButtons(){ return sugPop ? [...sugPop.querySelectorAll("button")] : []; }

function sugHighlight(i){
  const btns = sugButtons();
  if(!btns.length) return;
  sugHot = Math.max(0, Math.min(btns.length - 1, i));
  btns.forEach((b,j)=>b.classList.toggle("hot", j === sugHot));
  btns[sugHot].scrollIntoView({block:"nearest"});
}

function openSuggest(inp, f, pick){
  const kinds = SUGGEST_KINDS[f.k];
  if(!kinds) return;
  const q = inp.value.trim().toLowerCase();
  const cur = S.data[f.k];
  const chosen = new Set((Array.isArray(cur) ? cur : [String(cur||"")])
    .map(v=>String(v).replace(/^\[\[|\]\]$/g, "").toLowerCase()).filter(Boolean));

  let opts = [];
  for(const kind of kinds){
    const pool = kind === "tag" ? SUGGEST.tag : SUGGEST[kind].map(v=>({v, n:0}));
    for(const o of pool){
      if(chosen.has(o.v.toLowerCase())) continue;
      if(q && !o.v.toLowerCase().includes(q)) continue;
      opts.push({v:o.v, n:o.n, kind});
    }
  }
  if(q) opts.sort((a,b)=>
    (a.v.toLowerCase().startsWith(q) ? 0 : 1) - (b.v.toLowerCase().startsWith(q) ? 0 : 1));
  opts = opts.slice(0, 12);

  closeSuggest();
  if(!opts.length) return;
  sugPick = pick;

  const pop = document.createElement("div");
  pop.className = "suggestpop";
  const oneKind = kinds.length === 1;
  opts.forEach(o=>{
    const b = document.createElement("button");
    b.type = "button";
    const nm = document.createElement("span"); nm.textContent = o.v;
    b.appendChild(nm);
    if(o.kind === "tag" && o.n > 1){
      const u = document.createElement("span"); u.className = "uses";
      u.textContent = "\u00d7" + o.n;
      b.appendChild(u);
    }
    if(!oneKind){
      const k = document.createElement("span"); k.className = "kind"; k.textContent = o.kind;
      b.appendChild(k);
    }
    /* mousedown, not click - it fires before the input's blur, so the chips
       editor doesn't commit the half-typed text first */
    b.onmousedown = e=>{ e.preventDefault(); pick(o.v); };
    pop.appendChild(b);
  });
  /* grabbing the pop's own scrollbar blurs the input - remember that the
     blur came from inside the pop so the blur handler puts focus back
     instead of closing */
  pop.addEventListener("mousedown", ()=>{ sugKeepFocus = true; });
  document.body.appendChild(pop);

  const r = inp.getBoundingClientRect(), pad = 8;
  pop.style.left = Math.max(pad, Math.min(r.left, window.innerWidth - pop.offsetWidth - pad)) + "px";
  let top = r.bottom + 5;
  if(top + pop.offsetHeight > window.innerHeight - pad) top = Math.max(pad, r.top - pop.offsetHeight - 5);
  pop.style.top = top + "px";
  sugPop = pop;
}

function attachSuggest(inp, f, pick){
  if(!SUGGEST_KINDS[f.k]) return;
  const show = ()=>openSuggest(inp, f, pick);
  inp.addEventListener("input", show);
  inp.addEventListener("focus", show);
  /* a click on an already-focused box fires no focus event, so without this
     the menu couldn't be reopened after adding a tag */
  inp.addEventListener("click", show);
  inp.addEventListener("blur", ()=>setTimeout(()=>{
    if(sugKeepFocus){ sugKeepFocus = false; inp.focus(); return; }
    closeSuggest();
  }, 120));
  const prev = inp.onkeydown;
  inp.onkeydown = e=>{
    if(sugPop){
      if(e.key === "ArrowDown"){ e.preventDefault(); sugHighlight(sugHot + 1); return; }
      if(e.key === "ArrowUp"){ e.preventDefault(); sugHighlight(sugHot - 1); return; }
      if(e.key === "Enter" && sugHot >= 0){
        e.preventDefault();
        const b = sugButtons()[sugHot];
        if(b && sugPick){ sugPick(b.firstChild.textContent); }
        return;
      }
      if(e.key === "Escape"){ e.stopPropagation(); closeSuggest(); return; }
    }
    if(prev) prev.call(inp, e);
  };
}
window.addEventListener("scroll", e=>{
  if(sugPop && e.target instanceof Node && sugPop.contains(e.target)) return;
  closeSuggest();
}, true);
window.addEventListener("resize", closeSuggest);

/* ---- colour field ---------------------------------------------------------
   Stores a plain `#rrggbb` string, or blank for "no colour of its own". The
   value is world data about the entry, so it lives in the file like every
   other field - the library reads it and tints that entry's page with it.
   Blank is a real answer: the entry just wears its section's colour. */

const COLOR_PRESETS = ["#a78bdb","#d4899b","#6da7d8","#7fa860","#c9a227","#c96a4a","#4fb896","#8f8878"];

function colorEl(f){
  const box = document.createElement("div");
  box.className = "colorf";

  const cur = ()=>String(S.data[f.k] || "").trim();
  const valid = v => /^#[0-9a-f]{6}$/i.test(v);

  const pick = document.createElement("input");
  pick.type = "color";
  pick.title = "Pick a colour";

  const hex = document.createElement("input");
  hex.type = "text";
  hex.className = "hex";
  hex.placeholder = "#a78bdb";
  hex.spellcheck = false;

  const clear = document.createElement("button");
  clear.type = "button"; clear.className = "none"; clear.textContent = "clear";
  clear.title = "No colour of its own - use the section's";

  function paint(){
    const v = cur();
    hex.value = v;
    pick.value = valid(v) ? v : "#a78bdb";
    clear.hidden = !v;
  }
  function set(v){
    S.data[f.k] = v;
    paint(); markDirty();
  }

  pick.oninput = ()=>set(pick.value);
  hex.oninput = ()=>{
    let v = hex.value.trim();
    if(v && !v.startsWith("#")) v = "#" + v;
    S.data[f.k] = v;                       // keep what's typed, even mid-edit
    if(valid(v)) pick.value = v;
    clear.hidden = !v;
    markDirty();
  };
  hex.onblur = ()=>{ if(cur() && !valid(cur())) toast("Colour should look like #a78bdb - leaving it as typed.", true); };
  clear.onclick = ()=>set("");

  const sw = document.createElement("div"); sw.className = "swatches";
  COLOR_PRESETS.forEach(c=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "sw"; b.style.background = c; b.title = c;
    b.onclick = ()=>set(c);
    sw.appendChild(b);
  });

  box.append(pick, hex, sw, clear);
  paint();
  return box;
}

function chipsEl(f){
  const box = document.createElement("div");
  box.className = "chips";
  const inp = document.createElement("input");
  inp.type = "text";
  inp.placeholder = "type and press Enter";

  function redraw(){
    [...box.querySelectorAll(".chip")].forEach(c=>c.remove());
    (S.data[f.k]||[]).forEach((v,i)=>{
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = v;
      const x = document.createElement("button");
      x.textContent = "×";
      x.title = "remove";
      x.onclick = ()=>{ S.data[f.k].splice(i,1); redraw(); markDirty(); };
      c.appendChild(x);
      box.insertBefore(c, inp);
    });
  }
  inp.onkeydown = e=>{
    if(e.key === "Enter" || e.key === ","){
      e.preventDefault();
      const v = inp.value.trim();
      if(v){ (S.data[f.k] = S.data[f.k]||[]).push(v); inp.value=""; redraw(); markDirty(); }
    } else if(e.key === "Backspace" && !inp.value && (S.data[f.k]||[]).length){
      S.data[f.k].pop(); redraw(); markDirty();
    }
  };
  inp.onblur = ()=>{
    const v = inp.value.trim();
    if(v){ (S.data[f.k] = S.data[f.k]||[]).push(v); inp.value=""; redraw(); markDirty(); }
  };
  /* dropdown of existing entries / tags; picking adds a chip (skipping
     duplicates) and keeps the box focused for the next one */
  attachSuggest(inp, f, v=>{
    const list = (S.data[f.k] = S.data[f.k]||[]);
    if(!list.some(x=>String(x).toLowerCase() === v.toLowerCase())) list.push(v);
    inp.value = "";
    redraw(); markDirty(); closeSuggest();
    inp.focus();
    /* reopen with the remaining options so several can be picked in a row */
    inp.dispatchEvent(new Event("input"));
  });
  box.appendChild(inp);
  redraw();
  return box;
}

function colType(sec, i){
  return (sec.colTypes && sec.colTypes[i]) || "text";
}

/* Widgets keep closures over (section, row index). A type switch or reload
   replaces S.sections underneath them, so every handler checks the row is
   still there before writing to it. */
function rowAt(secKey, ri){
  const t = S.sections[secKey];
  return (Array.isArray(t) && Array.isArray(t[ri])) ? t[ri] : null;
}

function scaleWidget(sec, secKey, ri, ci, val){
  const sc   = sec.scale || {min:0, max:100, step:1};
  const MIN  = sc.min, MAX = sc.max;
  const REST = (MIN < 0 && MAX > 0) ? 0 : Math.round((MIN+MAX)/2);   // where an unset slider sits

  const box = document.createElement("div"); box.className = "scale";
  const rng = document.createElement("input");
  rng.type="range"; rng.min=String(MIN); rng.max=String(MAX); rng.step=String(sc.step||1);
  const num = document.createElement("input");
  num.type="number"; num.min=String(MIN); num.max=String(MAX); num.placeholder="-";
  const clr = document.createElement("button");
  clr.type="button"; clr.textContent="×"; clr.title="clear";

  function paint(v){
    const has = v !== "";
    num.value = has ? v : "";
    rng.value = has ? v : REST;
    rng.classList.toggle("unset", !has);
    rng.title = has ? v + " (" + MIN + " to " + MAX + ")" : "not set";
    const n = has ? Number(v) : 0;
    num.classList.toggle("neg", has && n < 0);
    num.classList.toggle("pos", has && n > 0);
  }
  function set(v){
    const row = rowAt(secKey, ri); if(!row) return;
    row[ci] = v;
    paint(v);
    markDirty();
  }
  rng.oninput = ()=> set(String(rng.value));
  num.oninput = ()=>{
    const row = rowAt(secKey, ri); if(!row) return;
    const s = num.value.trim();
    if(s === "" || s === "-"){ row[ci]=""; rng.classList.add("unset"); rng.value=REST; markDirty(); return; }
    let n = Math.round(Number(s));
    if(!isFinite(n)) return;
    n = Math.max(MIN, Math.min(MAX, n));
    row[ci] = String(n);
    rng.value = n; rng.classList.remove("unset");
    num.classList.toggle("neg", n < 0);
    num.classList.toggle("pos", n > 0);
    markDirty();
  };
  num.onblur = ()=>{ const row = rowAt(secKey, ri); if(row) paint(row[ci] || ""); };
  clr.onclick = ()=> set("");

  paint(String(val||"").trim());
  box.append(rng, num, clr);
  return box;
}

function sectionEl(sec, big){
  const wrap = document.createElement("div");
  wrap.className = "f";
  if(!big){
    const lab = document.createElement("label"); lab.textContent = sec.k;
    if(sec.guide) lab.appendChild(helpBubble(sec.guide, sec.k));
    wrap.appendChild(lab);
    if(sec.hint){ const h=document.createElement("div"); h.className="hint"; h.textContent=sec.hint; wrap.appendChild(h); }
  }

  if(sec.type === "table"){
    const nc = sec.cols.length;
    const tbl = document.createElement("table"); tbl.className = "ed";
    const thead = document.createElement("tr");
    if(sec.marker){
      const th = document.createElement("th"); th.className="mk"; th.textContent="◆"; th.title="importance marker";
      thead.appendChild(th);
    }
    sec.cols.forEach((c,ci)=>{
      const th=document.createElement("th"); th.textContent=c;
      if(colType(sec,ci)==="scale") th.className="sc";
      thead.appendChild(th);
    });
    thead.appendChild(document.createElement("th"));
    tbl.appendChild(thead);

    function drawRows(){
      [...tbl.querySelectorAll("tr.r")].forEach(r=>r.remove());
      (S.sections[sec.k]||[]).forEach((row,ri)=>{
        const tr = document.createElement("tr"); tr.className="r";

        if(sec.marker){
          const td = document.createElement("td"); td.className="mk";
          const sel = document.createElement("select"); sel.className="mk";
          MARKERS.forEach(m=>{
            const o=document.createElement("option");
            o.value=m.s; o.textContent = m.s || "–"; o.title=m.label;
            sel.appendChild(o);
          });
          sel.value = row[nc] || "";
          sel.classList.toggle("set", !!sel.value);
          sel.title = (MARKERS.find(m=>m.s===sel.value)||MARKERS[0]).label;
          sel.onchange = ()=>{
            const row = rowAt(sec.k, ri); if(!row) return;
            row[nc] = sel.value;
            sel.classList.toggle("set", !!sel.value);
            sel.title = (MARKERS.find(m=>m.s===sel.value)||MARKERS[0]).label;
            markDirty();
          };
          td.appendChild(sel); tr.appendChild(td);
        }

        sec.cols.forEach((c,ci)=>{
          const td = document.createElement("td");
          const kind = colType(sec,ci);
          if(kind === "scale"){
            td.className = "sc";
            td.appendChild(scaleWidget(sec, sec.k, ri, ci, row[ci]||""));
          } else {
            const inp = document.createElement("input"); inp.type="text";
            inp.value = row[ci]||"";
            if(ci === sec.linkCol) inp.placeholder = "name (becomes a link)";
            inp.oninput = ()=>{ const row = rowAt(sec.k, ri); if(!row) return; row[ci] = inp.value; markDirty(); };
            /* name columns suggest existing characters; the Relationships
               table's Relation column suggests the tree's standard words */
            const sugKey = ci === sec.linkCol ? "__person"
                         : (sec.k === "Relationships" && ci === 1) ? "__relation" : null;
            if(sugKey) attachSuggest(inp, {k:sugKey}, v=>{
              const row = rowAt(sec.k, ri); if(!row) return;
              inp.value = v; row[ci] = v; markDirty(); closeSuggest();
            });
            td.appendChild(inp);
          }
          tr.appendChild(td);
        });

        const td = document.createElement("td");
        const del = document.createElement("button"); del.className="rowdel"; del.textContent="×"; del.title="remove row";
        del.onclick = ()=>{
          S.sections[sec.k].splice(ri,1);
          if(!S.sections[sec.k].length) S.sections[sec.k] = [newRow(sec)];
          drawRows(); markDirty();
        };
        td.appendChild(del); tr.appendChild(td);
        tbl.appendChild(tr);
      });
    }
    drawRows();
    wrap.appendChild(tbl);
    const add = document.createElement("button");
    add.className = "btn sm"; add.textContent = "+ row";
    add.onclick = ()=>{ S.sections[sec.k].push(newRow(sec)); drawRows(); markDirty(); };
    wrap.appendChild(add);
    if(sec.marker){
      const lg = document.createElement("p"); lg.className="legend";
      lg.innerHTML = MARKERS.filter(m=>m.s)
        .map(m=>"<b>"+m.s+"</b> "+m.label.replace(/^\S+\s+/,""))
        .join(" &nbsp;·&nbsp; ");
      wrap.appendChild(lg);
    }
  }
  else if(sec.type === "checklist"){
    const host = document.createElement("div");
    function drawQ(){
      host.innerHTML = "";
      (S.sections[sec.k]||[]).forEach((v,i)=>{
        const row = document.createElement("div"); row.className="qrow";
        const inp = document.createElement("input"); inp.type="text"; inp.value=v;
        inp.placeholder = "something you haven't decided yet";
        inp.oninput = ()=>{ if(!Array.isArray(S.sections[sec.k])) return; S.sections[sec.k][i]=inp.value; markDirty(); };
        inp.onkeydown = e=>{
          if(e.key==="Enter"){
            e.preventDefault();
            if(!Array.isArray(S.sections[sec.k])) return;
            S.sections[sec.k].splice(i+1,0,""); drawQ();
            const nx = host.querySelectorAll("input")[i+1]; if(nx) nx.focus();
            markDirty();
          }
        };
        const del = document.createElement("button"); del.className="rowdel"; del.textContent="×";
        del.onclick = ()=>{
          S.sections[sec.k].splice(i,1);
          if(!S.sections[sec.k].length) S.sections[sec.k]=[""];
          drawQ(); markDirty();
        };
        row.appendChild(inp); row.appendChild(del); host.appendChild(row);
      });
      const add = document.createElement("button");
      add.className="btn sm"; add.textContent="+ question";
      add.onclick = ()=>{ S.sections[sec.k].push(""); drawQ(); markDirty(); };
      host.appendChild(add);
    }
    drawQ();
    wrap.appendChild(host);
  }
  else {
    const ta = document.createElement("textarea");
    ta.className = "prose";
    ta.value = S.sections[sec.k] || "";
    if(big) ta.style.minHeight = "220px";
    ta.oninput = ()=>{ S.sections[sec.k]=ta.value; markDirty(); };
    wrap.appendChild(ta);
  }
  return wrap;
}

/* ============================================================
   FORM MODE
   ============================================================ */

function renderForm(){
  const T = TYPES[S.type];
  const host = $("form");
  host.innerHTML = "";

  const core = ["name","aliases","status","tags"];
  const g1 = group("Core");
  const grid1 = document.createElement("div"); grid1.className="grid2";
  T.fields.filter(f=>core.includes(f.k)).forEach(f=>{
    const el = fieldEl(f); el.dataset.fk = f.k; grid1.appendChild(el);
  });
  g1.appendChild(grid1);

  // hook
  const hookWrap = document.createElement("div"); hookWrap.className="f";
  const hl = document.createElement("label"); hl.textContent = "Tagline";
  const hh = document.createElement("div"); hh.className="hint";
  hh.textContent = "One line, shown as a quote at the top of the file. Blank is fine.";
  const hta = document.createElement("textarea");
  hta.value = S.hook || ""; hta.style.minHeight="60px";
  hta.oninput = ()=>{ S.hook = hta.value; markDirty(); };
  hookWrap.append(hl,hh,hta);
  g1.appendChild(hookWrap);
  host.appendChild(g1);

  const rest = T.fields.filter(f=>!core.includes(f.k));
  if(rest.length){
    const g2 = group("Details");
    const grid2 = document.createElement("div"); grid2.className="grid2";
    rest.forEach(f=>{ const el = fieldEl(f); el.dataset.fk=f.k; grid2.appendChild(el); });
    g2.appendChild(grid2);
    host.appendChild(g2);
  }

  const g3 = group("Writing");
  T.sections.forEach(sec=> g3.appendChild(sectionEl(sec,false)));
  host.appendChild(g3);

  function group(title){
    const d = document.createElement("div"); d.className="group";
    const h = document.createElement("h3"); h.textContent=title; d.appendChild(h);
    return d;
  }
}

/* ============================================================
   GUIDED MODE
   ============================================================ */

function steps(){
  const all = TYPES[S.type].guided || [];
  return S.deep ? all : all.filter(s => s.tier === 1);
}
function extraCount(){
  return (TYPES[S.type].guided || []).filter(s => s.tier === 2).length;
}

function renderGuided(){
  const host = $("guided");
  host.innerHTML = "";
  const T = TYPES[S.type];
  const all = steps();
  S.step = Math.max(0, Math.min(S.step, all.length-1));
  const st = all[S.step];
  const last = S.step === all.length-1;

  const bar = document.createElement("div"); bar.className="prog";
  const fill = document.createElement("i");
  fill.style.width = (all.length<2 ? 100 : (S.step/(all.length-1))*100).toFixed(1)+"%";
  bar.appendChild(fill); host.appendChild(bar);

  const n = document.createElement("div"); n.className="step-n";
  n.textContent = T.label + " · " + (S.step+1) + " of " + all.length + (S.deep ? "" : " · essentials");
  host.appendChild(n);

  const q = document.createElement("h2"); q.className="step-q";
  const g = document.createElement("p"); g.className="step-guide";

  let body;
  if(st.hook){
    q.textContent = "The tagline - in one sentence, what is this?";
    g.textContent = T.hookGuide || "One line that makes someone want to know more. Blank is fine.";
    const ta = document.createElement("textarea");
    ta.className="prose"; ta.style.minHeight="90px"; ta.value = S.hook||"";
    ta.oninput = ()=>{ S.hook=ta.value; markDirty(); };
    body = ta;
  }
  else if(st.fields){
    const defs = st.fields.map(k => T.fields.find(f => f.k === k)).filter(Boolean);
    const single = defs.length === 1;
    q.textContent = st.q || (single ? defs[0].label : "");
    g.textContent = st.guide || (single ? (defs[0].guide || defs[0].hint || "") : "");
    body = document.createElement("div");
    if(!single) body.className = "grid2";
    defs.forEach(f=>{
      const el = fieldEl(f);
      el.dataset.fk = f.k;
      if(single){
        const l = el.querySelector("label"); if(l) l.remove();
        const h = el.querySelector(".hint"); if(h && st.guide) h.remove();
      }
      body.appendChild(el);
    });
  }
  else {
    const sec = T.sections.find(s => s.k === st.section);
    q.textContent = st.q || sec.k;
    g.textContent = st.guide || sec.guide || sec.hint || "";
    body = sectionEl(sec, true);
  }

  host.appendChild(q);
  if(g.textContent) host.appendChild(g);
  host.appendChild(body);

  const nav = document.createElement("div"); nav.className="nav";

  const back = document.createElement("button");
  back.className="btn"; back.textContent="← Back";
  back.disabled = S.step === 0;
  back.onclick = ()=>{ S.step--; renderGuided(); };
  nav.appendChild(back);

  const next = document.createElement("button");
  next.className="btn primary";
  next.textContent = last ? "Done - review in Form" : "Next →";
  next.onclick = ()=>{ if(last) setMode("form"); else { S.step++; renderGuided(); } };
  nav.appendChild(next);

  if(last && !S.deep && extraCount()){
    const more = document.createElement("button");
    more.className = "btn";
    more.textContent = "Keep going (" + extraCount() + " more)";
    more.title = "Optional depth: backstory, appearance, tags and so on";
    more.onclick = ()=>{ S.deep = true; S.step = all.length; renderGuided(); };
    nav.appendChild(more);
  } else if(!last){
    const skip = document.createElement("button");
    skip.className="btn ghost"; skip.textContent="Skip";
    skip.onclick = ()=>{ S.step++; renderGuided(); };
    nav.appendChild(skip);
  }

  const hint = document.createElement("span");
  hint.style.cssText="color:var(--ink-faint);font-size:12.5px;margin-left:auto";
  hint.innerHTML = '<span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to continue';
  nav.appendChild(hint);
  host.appendChild(nav);

  const first = body.querySelector("input,textarea,select");
  if(first) setTimeout(()=>first.focus(), 30);
}

/* Theme - the head script already applied it; this button cycles it and stores
   the choice under the same key every tool reads. System is the default and
   stays in the cycle, so following the OS is never a one-way door. */
const SYSTEM_LIGHT = window.matchMedia("(prefers-color-scheme: light)");
const THEME_ICON = {system:"◐", dark:"☾", light:"☀"};
const THEME_TITLE = {system:"Theme: follows your system", dark:"Theme: dark", light:"Theme: light"};

function themePref(){
  try{
    const v = localStorage.getItem("cdb-theme");
    return (v==="light"||v==="dark") ? v : "system";
  }catch(e){ return "system"; }
}

function applyTheme(pref){
  const dark = pref==="system" ? !SYSTEM_LIGHT.matches : pref==="dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("btnTheme").textContent = THEME_ICON[pref];
  $("btnTheme").title = THEME_TITLE[pref] + " - click to change";
}

$("btnTheme").onclick = ()=>{
  /* Flip to the opposite of what's actually on screen. The old
     system -> dark -> light cycle spent a click doing nothing visible: on a
     machine whose OS is dark, "follow system" and "dark" render identically,
     so reaching light took two clicks while returning took one. Following the
     system is still selectable from the dashboard's settings, which lists all
     three explicitly. */
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try{
    if(next==="system") localStorage.removeItem("cdb-theme");
    else localStorage.setItem("cdb-theme", next);
  }catch(e){}
  applyTheme(next);
};
SYSTEM_LIGHT.addEventListener("change", ()=>{ if(themePref()==="system") applyTheme("system"); });
/* another tab (the home page, say) changed the theme - follow it */
window.addEventListener("storage", e=>{
  if(e.key===null || e.key==="cdb-look"){
    let look=null;
    try{ look=localStorage.getItem("cdb-look"); }catch(err){}
    document.documentElement.dataset.look=(["atlas","board","iris","rose","slate"].indexOf(look) >= 0) ? look : "field";
  }
  if(e.key===null || e.key==="cdb-theme") applyTheme(themePref());
});
applyTheme(themePref());

$("btnConnect").onclick = connectFolder;
$("btnOpen").onclick = openPicker;
$("btnNew").onclick = ()=>{
  if(S.dirty && !confirm("Unsaved changes. Start a new entry anyway?")) return;
  blank(S.type); render();
};
$("btnSave").onclick = save;
$("btnDelete").onclick = deleteEntry;
[...document.querySelectorAll("#modeSeg button")].forEach(b=> b.onclick = ()=>setMode(b.dataset.mode));

document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key==="s"){ e.preventDefault(); save(); }
  if((e.ctrlKey||e.metaKey) && e.key==="Enter" && S.mode==="guided"){
    e.preventDefault();
    const all = steps();
    if(S.step < all.length-1){ S.step++; renderGuided(); } else setMode("form");
  }
});

window.addEventListener("beforeunload", e=>{
  if(S.dirty){ e.preventDefault(); e.returnValue=""; }
});

if(!FS_OK){ $("fsDot").className="dot warn"; $("fsLabel").textContent="download mode"; }
else restoreFolder();

/* Deep links from index.html - "#type=location&mode=guided", plus
   "open=Name.md" to jump straight into editing an existing entry. All parts
   are optional and anything unrecognised falls back to a blank character in
   form mode, which is what opening the file bare has always done. */
function fromHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/,""));
  const type = p.get("type"), mode = p.get("mode"), open = p.get("open");
  return {
    type: TYPES[type] ? type : "character",
    mode: (mode==="guided"||mode==="form") ? mode : "form",
    open: open ? (/\.md$/i.test(open) ? open : open + ".md") : null
  };
}

initTypes();
const start = fromHash();
blank(start.type);
$("typeSel").value = start.type;
setMode(start.mode);
if(start.open){
  PENDING_OPEN = { file: start.open, type: start.type };
  tryPendingOpen();          // in case a folder is somehow already connected
}

/* This page lives in Tools/; the dashboard is one level up. NAV_TOOLS

const NAV_BASE = "";
const NAV_HOME = "../index.html";

(function(){
  const btn = document.getElementById("btnNav");
  if(!btn) return;

  const scrim = document.createElement("div");
  scrim.id = "navScrim";

  const drawer = document.createElement("nav");
  drawer.id = "navDrawer";
  drawer.setAttribute("aria-label", "Tools");

  const h = document.createElement("h2");
  h.textContent = "Tools";
  drawer.appendChild(h);

  /* The list order is yours - drag a row to move it. The order rides one
     shared localStorage key so every tool shows the same list (pure UI
     convenience, no world data - GROUND-RULES rule 1). A tool missing from
     the saved order - a future new one - keeps its default place. */
  const NAV_ORDER_KEY = "cdb-navorder";
  function navOrder(){
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(NAV_ORDER_KEY) || "null"); }catch(e){}
    if(!Array.isArray(saved)) return NAV_TOOLS.slice();
    const byHref = new Map(NAV_TOOLS.map(t=>[t.href, t]));
    const out = [];
    saved.forEach(href=>{ const t = byHref.get(href); if(t){ out.push(t); byHref.delete(href); } });
    NAV_TOOLS.forEach(t=>{ if(byHref.has(t.href)) out.push(t); });
    return out;
  }
  function saveOrder(list){
    try{ localStorage.setItem(NAV_ORDER_KEY, JSON.stringify(list.map(t=>t.href))); }catch(e){}
  }

  const foot = document.createElement("div");
  foot.className = "navfoot";
  foot.textContent = "Drag a row to reorder - every tool follows. They all read the same folder: connect it once and they remember it.";

  let dragHref = null;
  function renderNav(){
    [...drawer.querySelectorAll("a, span.navhere")].forEach(el=>el.remove());
    navOrder().forEach(t=>{
      const here = t.href === NAV_HERE;
      const el = document.createElement(here ? "span" : "a");
      if(here){ el.className = "navhere"; el.setAttribute("aria-current","page"); }
      else { el.href = t.href === "index.html" ? NAV_HOME : NAV_BASE + t.href; }
      const g = document.createElement("span"); g.className = "g"; g.textContent = t.g;
      const s = document.createElement("span"); s.textContent = t.label;
      el.append(g, s);
      el.draggable = true;
      el.title = "Drag to reorder";
      el.addEventListener("dragstart", e=>{
        dragHref = t.href;
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", t.href); }catch(err){}
      });
      el.addEventListener("dragover", e=>{ if(dragHref && dragHref !== t.href) e.preventDefault(); });
      el.addEventListener("drop", e=>{
        e.preventDefault();
        if(!dragHref || dragHref === t.href) return;
        const cur = navOrder();
        const from = cur.findIndex(x=>x.href === dragHref);
        const to = cur.findIndex(x=>x.href === t.href);
        if(from < 0 || to < 0) return;
        const moved = cur.splice(from, 1)[0];
        cur.splice(to, 0, moved);
        saveOrder(cur);
        dragHref = null;
        renderNav();
      });
      el.addEventListener("dragend", ()=>{ dragHref = null; });
      drawer.insertBefore(el, foot);
    });
  }

  drawer.appendChild(foot);
  renderNav();
  /* a reorder made in another open tab shows up here too */
  window.addEventListener("storage", e=>{
    if(e.key === null || e.key === NAV_ORDER_KEY) renderNav();
  });

  document.body.append(scrim, drawer);

  let open = false;
  function setNav(next){
    open = next;
    scrim.classList.toggle("open", open);
    drawer.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if(open){
      const first = drawer.querySelector("a");
      if(first) first.focus();
    } else {
      btn.focus();
    }
  }

  btn.setAttribute("aria-expanded","false");
  btn.onclick = e => { e.stopPropagation(); setNav(!open); };
  scrim.onclick = () => setNav(false);
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape" && open){ e.stopPropagation(); setNav(false); }
  }, true);
})();
</script>

<!-- cloud storage: makes Supabase look like the folder these tools expect -->
<script src="/world-codex/config.js"></script>
<script src="/world-codex/cloud-fs.js"></script>
</body>
</html>

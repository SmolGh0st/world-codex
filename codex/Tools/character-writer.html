<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Writer</title>
<script>
/* Shared with index.html and family-tree.html: one stored key, applied before
   first paint. No key at all means "follow the system". */
(function(){
  var pref = null;
  try{ pref = localStorage.getItem("cdb-theme"); }catch(e){}
  if(pref !== "light" && pref !== "dark") pref = null;
  var dark = pref ? pref==="dark"
                  : !window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  /* the look (colour family) rides a second shared key; field is the default */
  var look = null;
  try{ look = localStorage.getItem("cdb-look"); }catch(e){}
  if(["atlas","board","iris","rose","slate"].indexOf(look) < 0) look = "field";
  document.documentElement.dataset.look = look;
})();
</script>
<style>
  :root{
    --bg:#14120f;
    --panel:#1c1a16;
    --panel-2:#232019;
    --line:#332e25;
    --line-soft:#28241d;
    --ink:#ece4d6;
    --ink-dim:#a99e8b;
    --ink-faint:#6f665a;
    --accent:#c9a227;
    --accent-soft:#3a3018;
    --accent-line:#4a3d1d;
    --accent-hover:#dcb433;
    --on-accent:#1a1508;
    --btn-hover:#2a251b;
    --danger:#c96a4a;
    --danger-ink:#f0c0ae;
    --neg:#e8907a;
    --neg-line:#5a2f22;
    --pos:#a9d38a;
    --pos-line:#33502a;
    --scrim:rgba(0,0,0,.66);
    --ok:#7fa860;
    --radius:10px;
    color-scheme:dark;
  }
  /* Light - same palette turned inside out. Set on <html> by the script above. */
  :root[data-theme="light"]{
    --bg:#f7f3ea;
    --panel:#fffdf8;
    --panel-2:#efe9dc;
    --line:#dbd1bd;
    --line-soft:#e9e1d1;
    --ink:#2a251c;
    --ink-dim:#5d5548;
    --ink-faint:#877d6d;
    --accent:#8a6d10;
    --accent-soft:#f2e7c2;
    --accent-line:#d8c68a;
    --accent-hover:#a1811d;
    --on-accent:#fffdf6;
    --btn-hover:#e7dfcf;
    --danger:#a8431f;
    --danger-ink:#8c3316;
    --neg:#9a3c1c;
    --neg-line:#e0b9a8;
    --pos:#3f6b28;
    --pos-line:#bcd4ab;
    --scrim:rgba(60,50,30,.35);
    --ok:#4e7233;
    color-scheme:light;
  }

  /* ---------- looks ----------------------------------------------------
     Three colour families shared by every tool, picked in the home page's
     Settings (cdb-look). Field is the base palette above; Atlas and Board
     override surfaces and accent. Semantic colours (danger, ok, the
     loyalty pos/neg pair) stay the same in every look. */
  :root[data-look="atlas"]{
    --bg:#111814; --panel:#19231d; --panel-2:#212d26;
    --line:#35453b; --line-soft:#273229;
    --ink:#e2dec9; --ink-dim:#a39d87; --ink-faint:#6e796e;
    --accent:#4fb896; --accent-soft:#163529; --accent-line:#2b5546;
    --accent-hover:#65cbaa; --on-accent:#062318; --btn-hover:#243128;
  }
  :root[data-look="atlas"][data-theme="light"]{
    --bg:#e7e7d8; --panel:#f4f4e8; --panel-2:#dfdfca;
    --line:#c2c2a6; --line-soft:#d6d6c0;
    --ink:#35322a; --ink-dim:#5e5947; --ink-faint:#83816b;
    --accent:#1d6b58; --accent-soft:#d7eae1; --accent-line:#a6ccbd;
    --accent-hover:#27816a; --on-accent:#f5fbf8; --btn-hover:#e5e5d2;
  }
  :root[data-look="board"]{
    --bg:#171310; --panel:#201a15; --panel-2:#2a2219;
    --line:#3a2f24; --line-soft:#2b231c;
    --ink:#e6dcc6; --ink-dim:#a69c85; --ink-faint:#786b57;
    --accent:#b58f4a; --accent-soft:#372a15; --accent-line:#584421;
    --accent-hover:#c8a35e; --on-accent:#251803; --btn-hover:#2f261d;
  }
  :root[data-look="board"][data-theme="light"]{
    --bg:#e8dcc5; --panel:#f2e7d1; --panel-2:#dfd0b3;
    --line:#c5af85; --line-soft:#d7c7a6;
    --ink:#2e2822; --ink-dim:#5d5343; --ink-faint:#7c6e54;
    --accent:#6e5624; --accent-soft:#ecdfbc; --accent-line:#cab383;
    --accent-hover:#83682a; --on-accent:#fdf9ee; --btn-hover:#e7dabe;
  }
  :root[data-look="iris"]{
    --bg:#151218; --panel:#1d1924; --panel-2:#262030;
    --line:#383046; --line-soft:#2b2537;
    --ink:#e8e2f0; --ink-dim:#a79fb6; --ink-faint:#6f6880;
    --accent:#a78bdb; --accent-soft:#2c2344; --accent-line:#473a66;
    --accent-hover:#baa2e8; --on-accent:#170f26; --btn-hover:#2a2438;
  }
  :root[data-look="iris"][data-theme="light"]{
    --bg:#f2eef7; --panel:#fcfaff; --panel-2:#e7e0f0;
    --line:#cfc3e0; --line-soft:#ded4ea;
    --ink:#2b2438; --ink-dim:#5a5168; --ink-faint:#837a92;
    --accent:#6b4fa8; --accent-soft:#e6dcf5; --accent-line:#c3aee3;
    --accent-hover:#7d61bd; --on-accent:#f9f6ff; --btn-hover:#e3dbef;
    --shadow:rgba(60,50,80,.18);
  }
  :root[data-look="rose"]{
    --bg:#191214; --panel:#221a1d; --panel-2:#2c2226;
    --line:#443037; --line-soft:#332529;
    --ink:#eee0e4; --ink-dim:#b39ba3; --ink-faint:#7d6970;
    --accent:#d4899b; --accent-soft:#3d222b; --accent-line:#5e3644;
    --accent-hover:#e29fb0; --on-accent:#260f16; --btn-hover:#2f2529;
  }
  :root[data-look="rose"][data-theme="light"]{
    --bg:#f7eef0; --panel:#fffafb; --panel-2:#f0e1e5;
    --line:#ddc3ca; --line-soft:#ead5da;
    --ink:#35262b; --ink-dim:#645057; --ink-faint:#8f7a81;
    --accent:#a04360; --accent-soft:#f4dbe3; --accent-line:#dfadbd;
    --accent-hover:#b55573; --on-accent:#fff7f9; --btn-hover:#eddde1;
    --shadow:rgba(80,50,60,.18);
  }
  :root[data-look="slate"]{
    --bg:#10141a; --panel:#171d26; --panel-2:#1f2733;
    --line:#303c4d; --line-soft:#26303e;
    --ink:#dde4ee; --ink-dim:#94a1b4; --ink-faint:#627082;
    --accent:#6da7d8; --accent-soft:#16293c; --accent-line:#2a4a68;
    --accent-hover:#85b9e4; --on-accent:#06131f; --btn-hover:#232d3a;
  }
  :root[data-look="slate"][data-theme="light"]{
    --bg:#e9edf2; --panel:#f7f9fc; --panel-2:#dde4ec;
    --line:#bcc8d6; --line-soft:#d2dae4;
    --ink:#27303b; --ink-dim:#4f5b6a; --ink-faint:#77828f;
    --accent:#2c6394; --accent-soft:#d9e7f3; --accent-line:#a5c4dd;
    --accent-hover:#3a76ab; --on-accent:#f6fafd; --btn-hover:#dbe2ea;
    --shadow:rgba(45,60,80,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif}

  /* ---------- layout ---------- */
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:20;
  }
  .brand{font-weight:650;letter-spacing:.2px;margin-right:2px}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase}
  .grow{flex:1}
  main{display:grid;grid-template-columns:1fr 400px;height:calc(100vh - 57px)}
  @media (max-width:1000px){main{grid-template-columns:1fr}#preview{display:none}}
  #work{overflow-y:auto;padding:26px 30px 90px}
  #preview{
    border-left:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:18px 20px 60px;
  }
  #preview h4{margin:0 0 10px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  #previewText{
    white-space:pre-wrap;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--ink-dim);margin:0;word-break:break-word;
  }

  /* ---------- controls ---------- */
  button,select,input,textarea{font:inherit;color:inherit}
  .btn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:7px 13px;border-radius:8px;cursor:pointer;transition:.13s;
  }
  .btn:hover{border-color:var(--accent);background:var(--btn-hover)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 9px;font-size:13px;border-radius:6px}
  /* colour field - swatch, hex box, a few suggestions, and a clear button */
  .colorf{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .colorf input[type=color]{
    width:38px;height:32px;padding:0;flex:none;cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  }
  .colorf input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
  .colorf input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
  .colorf input.hex{
    width:104px;flex:none;font-family:ui-monospace,Consolas,monospace;font-size:13px;
  }
  .colorf .swatches{display:flex;gap:5px;flex-wrap:wrap}
  .colorf .sw{
    width:19px;height:19px;padding:0;border-radius:50%;cursor:pointer;
    border:1px solid var(--line);
  }
  .colorf .sw:hover{transform:scale(1.15)}
  .colorf .none{font-size:12px;color:var(--ink-faint);background:none;border:0;cursor:pointer;padding:2px 4px}
  .colorf .none:hover{color:var(--danger-ink);text-decoration:underline}
  .btn.danger{color:var(--danger-ink);border-color:var(--line)}
  .btn.danger:hover:not(:disabled){border-color:var(--danger);background:var(--btn-hover)}
  .btn:disabled{opacity:.4;cursor:default}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;padding:7px 13px;cursor:pointer;color:var(--ink-dim)}
  .seg button.on{background:var(--accent-soft);color:var(--ink)}
  select.plain{background:var(--panel-2);border:1px solid var(--line);padding:7px 10px;border-radius:8px}

  input[type=text],input[type=date],input[type=number],textarea,select.field{
    width:100%;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;outline:none;transition:border-color .13s;
  }
  input:focus,textarea:focus,select.field:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:90px;line-height:1.6}
  textarea.prose{font-family:ui-serif,Georgia,serif;font-size:15.5px;min-height:130px}
  ::placeholder{color:var(--ink-faint)}

  /* ---------- form ---------- */
  .group{margin-bottom:30px}
  .group > h3{
    margin:0 0 14px;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--line-soft);padding-bottom:7px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:700px){.grid2{grid-template-columns:1fr}}
  .f{margin-bottom:15px}
  .f label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .f .hint{font-size:12.5px;color:var(--ink-faint);margin:-1px 0 6px;line-height:1.45}

  /* ---------- help bubbles ------------------------------------------------
     A "?" beside a label whose meaning isn't obvious from the label alone.
     Click for a popover; Esc or a click elsewhere closes it. In this file the
     text is the field's own `guide` - the same words guided mode shows - so
     form mode stops being the mode where the explanations disappear. */
  .helpbub{
    display:inline-flex;align-items:center;justify-content:center;
    width:15px;height:15px;margin-left:6px;padding:0;flex:none;
    border-radius:50%;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink-faint);font:700 10.5px/1 inherit;
    cursor:pointer;vertical-align:middle;
  }
  .helpbub:hover,.helpbub:focus{border-color:var(--accent);color:var(--accent);outline:none}
  .helppop{
    position:fixed;z-index:200;max-width:290px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;box-shadow:0 14px 34px var(--shadow);
    font:400 12.5px/1.55 inherit;color:var(--ink-dim);
  }

  /* chips (list fields) */
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:40px}
  .chips:focus-within{border-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
    border:1px solid var(--accent-line);border-radius:999px;padding:2px 6px 2px 10px;font-size:13px}
  .chip button{background:none;border:0;color:var(--ink-faint);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .chip button:hover{color:var(--danger)}
  .chips input{flex:1;min-width:120px;background:none;border:0;outline:none;padding:4px}
  /* suggestion dropdown under link fields and the tag box */
  .suggestpop{
    position:fixed;z-index:250;min-width:210px;max-width:330px;max-height:242px;
    overflow-y:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 14px 34px var(--shadow);padding:4px;
  }
  .suggestpop button{
    display:flex;width:100%;text-align:left;background:none;border:0;border-radius:6px;
    padding:7px 10px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink);
    gap:10px;align-items:baseline;
  }
  .suggestpop button:hover,.suggestpop button.hot{background:var(--accent-soft)}
  .suggestpop .kind{margin-left:auto;flex:none;font-size:10px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase}
  .suggestpop .uses{flex:none;font-size:11px;color:var(--ink-faint)}

  /* portrait drop zone */
  .dropzone{
    margin-top:8px;border:1.5px dashed var(--line);border-radius:10px;
    padding:11px 13px;display:flex;align-items:center;gap:13px;cursor:pointer;
    color:var(--ink-faint);font-size:13px;line-height:1.45;transition:.13s;min-height:74px;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--ink-dim)}
  .dropzone img{width:56px;height:56px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);flex:none;background:var(--panel-2)}
  .dropzone img[hidden]{display:none}
  .dropzone b{color:var(--ink-dim);font-weight:600}

  /* tables */
  table.ed{width:100%;border-collapse:collapse;margin-bottom:8px}
  table.ed th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--ink-faint);font-weight:600;padding:0 6px 6px 0}
  table.ed td{padding:0 6px 6px 0;vertical-align:top}
  table.ed td:last-child,table.ed th:last-child{width:34px;padding-right:0}
  table.ed input{padding:7px 9px}
  th.mk,td.mk{width:52px;padding-right:6px}
  select.mk{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:7px 4px;text-align:center;font-size:15px;cursor:pointer;
  }
  select.mk:focus{border-color:var(--accent)}
  select.mk.set{color:var(--accent);border-color:var(--accent-line)}
  th.sc,td.sc{width:210px}
  .scale{display:flex;align-items:center;gap:7px}
  .scale input[type=range]{flex:1;accent-color:var(--accent);min-width:70px;height:20px;cursor:pointer}
  .scale input[type=range].unset{opacity:.35}
  .scale input[type=number]{
    width:66px;padding:7px 4px;text-align:center;
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    -moz-appearance:textfield;
  }
  .scale input[type=number].neg{color:var(--neg);border-color:var(--neg-line)}
  .scale input[type=number].pos{color:var(--pos);border-color:var(--pos-line)}
  .scale input[type=number]::-webkit-inner-spin-button,
  .scale input[type=number]::-webkit-outer-spin-button{opacity:.45;filter:invert(.85)}
  .scale button{background:none;border:0;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:2px 3px}
  .scale button:hover{color:var(--danger)}
  .legend{font-size:12px;color:var(--ink-faint);margin:8px 0 0;line-height:1.7}
  .legend b{color:var(--ink-dim);font-weight:600}
  .rowdel{background:none;border:0;color:var(--ink-faint);cursor:pointer;font-size:17px;padding:6px}
  .rowdel:hover{color:var(--danger)}

  /* checklist */
  .qrow{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
  .qrow input[type=text]{flex:1}

  /* ---------- guided ---------- */
  #guided{max-width:660px;margin:0 auto}
  .prog{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-bottom:34px}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .step-n{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
  .step-q{font-size:26px;line-height:1.25;margin:0 0 12px;font-family:ui-serif,Georgia,serif;font-weight:500}
  .step-guide{color:var(--ink-dim);font-size:14.5px;line-height:1.6;margin:0 0 22px;
    border-left:2px solid var(--line);padding-left:14px}
  .nav{display:flex;gap:10px;align-items:center;margin-top:26px;flex-wrap:wrap}
  .nav .btn{white-space:nowrap}
  .kbd{font:11px/1 ui-monospace,monospace;background:var(--panel-2);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--ink-faint)}

  /* ---------- misc ---------- */
  .status{font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
  .dot.on{background:var(--ok)}
  .dot.warn{background:var(--accent)}
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;
    opacity:0;pointer-events:none;transition:.2s;z-index:60;font-size:14px;max-width:80vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:var(--danger);color:var(--danger-ink)}
  dialog{
    background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:0;max-width:520px;width:92vw;
  }
  dialog::backdrop{background:var(--scrim);backdrop-filter:blur(2px)}
  .dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600}
  .dlg-b{padding:18px 20px;max-height:60vh;overflow:auto}
  .dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .filelist{display:flex;flex-direction:column;gap:2px}
  .filelist button{
    text-align:left;background:none;border:0;border-radius:6px;padding:9px 11px;cursor:pointer;color:var(--ink);
  }
  .filelist button:hover{background:var(--panel-2)}
  .note{font-size:13px;color:var(--ink-dim);line-height:1.6}
  code{font:12.5px ui-monospace,monospace;background:var(--panel-2);padding:1px 5px;border-radius:4px}
  .unsaved:after{content:"•";color:var(--accent);margin-left:5px}
  /* the spinner arrows are drawn dark, so they only need inverting on the dark theme */
  :root[data-theme="light"] .scale input[type=number]::-webkit-inner-spin-button,
  :root[data-theme="light"] .scale input[type=number]::-webkit-outer-spin-button{filter:none}
  .btn.icon{padding:5px 9px;font-size:14px;line-height:1.35}

  /* ---------- tool nav drawer ---------------------------------------------
     The three-line button at the far left of every header opens the same
     list of every tool, so you can move between them without going via the
     home page. Identical markup, CSS and behaviour in all of them; the tool
     you're already in is marked and not a link.

     The list is duplicated per file rather than shared, because these pages
     are deliberately standalone - no build step, no common runtime. Adding a
     tool later means one line in each NAV_TOOLS array. */
  .navbtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    width:34px;height:32px;flex:none;border-radius:8px;cursor:pointer;
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:0;transition:.13s;
  }
  .navbtn span{display:block;width:15px;height:1.5px;background:currentColor;border-radius:1px}

<header>

      {tier:1, fields:["name"], q:"What's this event called?",
        guide:"A working title is fine. You can rename the file later."},
      {tier:1, hook:true},
      {tier:1, fields:["date","era"], q:"When did it happen?"},
      {tier:1, section:"What Happened"},
      {tier:1, fields:["involves"], q:"Who and what does it touch?",
        guide:"Characters, locations, factions - anyone this happened to or because of. Becomes links, so it'll show up on their pages later."},
      {tier:1, section:"Open Questions"},

      {tier:2, fields:["status","tags"], q:"Housekeeping"}
    ]
  }
};

/* ============================================================
   STATE
   ============================================================ */

const S = {
  type: "character",
  data: {},        // frontmatter values
  hook: "",
  sections: {},    // key -> string | rows[][] | items[]
  mode: "form",
  step: 0,
  deep: false,
  rootHandle: null,
  savedHandle: null,   // remembered across visits; may need permission renewing
  fileHandle: null,
  fileName: null,
  dirty: false
};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const FS_OK = typeof window.showDirectoryPicker === "function";

function toast(msg, isErr){
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className=""; }, isErr ? 5200 : 2400);
}

function slug(s){
  return String(s||"").toLowerCase().trim()
    .replace(/['']/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function today(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function markDirty(){
  S.dirty = true;
  $("fileLabel").classList.add("unsaved");
  renderPreview();
}

/* ============================================================
   BLANK / RESET
   ============================================================ */

function blank(type){
  const T = TYPES[type];
  S.type = type;
  S.data = {};
  T.fields.forEach(f=>{
    if(f.type==="list"||f.type==="linklist") S.data[f.k] = [];
    else S.data[f.k] = f.def || "";
  });
  S.data.created = today();
  S.data.updated = today();
  S.hook = "";
  S.sections = {};
  T.sections.forEach(s=>{
    S.sections[s.k] = s.type==="table" ? [newRow(s)] : s.type==="checklist" ? [""] : "";
  });
  S.fileHandle = null;
  S.fileName = null; S.fileFolder = null;
  S.step = 0;
  S.deep = false;
  S.dirty = false;
  $("fileLabel").classList.remove("unsaved");
  $("fileLabel").textContent = "new " + T.label.toLowerCase();
}

/* ============================================================
   SERIALISE  →  markdown
   ============================================================ */

function yq(v){
  // quote a scalar if it needs it
  const s = String(v);
  if(s === "") return "";
  if(/^(true|false|null|~)$/i.test(s)) return s;
  if(/^-?\d+(\.\d+)?$/.test(s)) return s;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/[:#\[\]{}",&*?|<>=!%@`]/.test(s) || /^\s|\s$/.test(s)) return JSON.stringify(s);
  return s;
}
function yqStr(v){ return JSON.stringify(String(v)); }

function newRow(sec){
  return new Array(sec.cols.length + (sec.marker?1:0)).fill("");
}
function markerOf(sec, row){ return sec.marker ? String(row[sec.cols.length]||"") : ""; }

function tableToMd(sec, rows){
  const cols = sec.cols;
  const used = (rows||[]).filter(r => cols.some((_,i)=> String(r[i]||"").trim()!==""));
  const body = (used.length?used:[newRow(sec)]).map(r=>{
    const cells = cols.map((_,i)=>{
      let v = String(r[i]||"").trim();
      if(i===sec.linkCol){
        if(v && !/^\[\[/.test(v)) v = "[["+v+"]]";
        const mk = markerOf(sec, r);
        if(mk) v = (v ? mk+" "+v : mk);
      }
      return v.replace(/\|/g,"\\|");
    });
    return "| " + cells.join(" | ") + " |";
  }).join("\n");
  return "| " + cols.join(" | ") + " |\n|" + cols.map(()=>"---").join("|") + "|\n" + body;
}

function buildMd(){
  const T = TYPES[S.type];
  const L = [];

  L.push("---");
  T.fields.forEach(f=>{
    const v = S.data[f.k];
    if(f.type==="list"){
      L.push(f.k+": [" + (v||[]).map(yqStr).join(", ") + "]");
    } else if(f.type==="linklist"){
      L.push(f.k+": [" + (v||[]).map(x=>yqStr(/^\[\[/.test(x)?x:"[["+x+"]]")).join(", ") + "]");
    } else if(f.type==="link"){
      const s = String(v||"").trim();
      L.push(s ? f.k+": " + yqStr(/^\[\[/.test(s)?s:"[["+s+"]]") : f.k+":");
    } else {
      const s = yq(v||"");
      L.push(s ? f.k+": "+s : f.k+":");
    }
  });
  L.push("created: " + (S.data.created||today()));
  L.push("updated: " + (S.data.updated||today()));
  L.push("---");
  L.push("");
  L.push("# " + (S.data.name||"Untitled"));
  L.push("");
  if(String(S.hook||"").trim()){
    String(S.hook).trim().split("\n").forEach(l=>L.push("> "+l));
    L.push("");
  }

  T.sections.forEach(sec=>{
    L.push("## " + sec.k);
    L.push("");
    const v = S.sections[sec.k];
    if(sec.type==="table"){
      L.push(tableToMd(sec, v||[]));
    } else if(sec.type==="checklist"){
      const items = (v||[]).map(x=>String(x||"").trim()).filter(Boolean);
      L.push(items.length ? items.map(x=>"- [ ] "+x).join("\n") : "- [ ] ");
    } else {
      L.push(String(v||"").trim());
    }
    L.push("");
  });

  if(S.type==="character" && String(S.data.main_ref||"").trim()){
    L.push("## Art");
    L.push("");
    L.push("![]("+String(S.data.main_ref).trim()+")");
    L.push("");
  }

  return L.join("\n").replace(/\n{3,}/g,"\n\n").trimEnd() + "\n";
}

/* ============================================================
   PARSE  ←  markdown
   ============================================================ */

function stripLink(s){
  const m = String(s||"").trim().match(/^\[\[(.+?)\]\]$/);
  return m ? m[1] : String(s||"").trim();
}

function parseYamlList(raw){
  const inner = raw.trim().replace(/^\[/,"").replace(/\]$/,"");
  if(!inner.trim()) return [];
  const out=[]; let cur=""; let q=null;
  for(let i=0;i<inner.length;i++){
    const c = inner[i];
    if(q){
      if(c==="\\" && i+1<inner.length){ cur+=inner[++i]; continue; }
      if(c===q){ q=null; continue; }
      cur+=c;
    } else if(c==='"'||c==="'"){ q=c; }
    else if(c===","){ out.push(cur.trim()); cur=""; }
    else cur+=c;
  }
  if(cur.trim()) out.push(cur.trim());
  return out.filter(Boolean);
}

function parseFile(text){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  const fm = {};
  let body = text;
  if(m){
    body = text.slice(m[0].length);
    m[1].split(/\r?\n/).forEach(line=>{
      if(!line.trim() || /^\s*#/.test(line)) return;
      const i = line.indexOf(":");
      if(i < 0) return;
      const k = line.slice(0,i).trim();
      let v = line.slice(i+1).trim();
      if(v.startsWith("[")){ fm[k] = parseYamlList(v); return; }
      if(v.startsWith('"') || v.startsWith("'")){
        const qc = v[0];
        let end = -1;
        for(let j=1;j<v.length;j++){ if(v[j]==="\\"){j++;continue;} if(v[j]===qc){end=j;break;} }
        fm[k] = end>0 ? v.slice(1,end).replace(/\\"/g,'"').replace(/\\\\/g,"\\") : v.slice(1);
        return;
      }
      v = v.replace(/\s+#.*$/,"").trim();
      fm[k] = v;
    });
  }

  // split body into sections
  const lines = body.split(/\r?\n/);
  const sec = {}; let cur = "__pre__"; let buf = [];
  for(const line of lines){
    const h = line.match(/^##\s+(.+?)\s*$/);
    if(h){ sec[cur] = buf.join("\n"); cur = h[1]; buf = []; }
    else buf.push(line);
  }
  sec[cur] = buf.join("\n");

  // hook = blockquote in preamble
  const pre = sec.__pre__ || "";
  const hookLines = pre.split("\n").filter(l=>/^>\s?/.test(l)).map(l=>l.replace(/^>\s?/,""));
  return { fm, sec, hook: hookLines.join("\n").trim() };
}

function mdTableToRows(md, sec){
  const ncols = sec.cols.length;
  const rows = [];
  md.split("\n").forEach(line=>{
    const t = line.trim();
    if(!t.startsWith("|")) return;
    if(/^\|[\s:\-|]+\|$/.test(t)) return;                 // separator
    const cells = t.replace(/^\|/,"").replace(/\|$/,"").split(/(?<!\\)\|/).map(c=>c.replace(/\\\|/g,"|").trim());
    rows.push(cells);
  });
  if(rows.length) rows.shift();                            // header row
  const out = rows.map(r=>{
    const a = newRow(sec);
    let mk = "";
    for(let i=0;i<ncols;i++){
      let v = String(r[i]||"").trim();
      if(i === sec.linkCol && sec.marker){
        const m = v.match(/^(\S)\s*(.*)$/);
        if(m && MARKER_SET.indexOf(m[1]) >= 0){ mk = m[1]; v = m[2].trim(); }
      }
      a[i] = stripLink(v);
    }
    if(sec.marker) a[ncols] = mk;
    return a;
  }).filter(r=>sec.cols.some((_,i)=>r[i]!==""));
  return out.length ? out : [newRow(sec)];
}

function loadFromText(text, type){
  const P = parseFile(text);
  blank(type);
  const T = TYPES[type];
  T.fields.forEach(f=>{
    const v = P.fm[f.k];
    if(v === undefined) return;
    if(f.type==="list") S.data[f.k] = Array.isArray(v)?v:parseYamlList(String(v));
    else if(f.type==="linklist") S.data[f.k] = (Array.isArray(v)?v:parseYamlList(String(v))).map(stripLink);
    else if(f.type==="link") S.data[f.k] = stripLink(v);
    else S.data[f.k] = String(v);
  });
  if(P.fm.created) S.data.created = String(P.fm.created);
  S.data.updated = today();
  S.hook = P.hook;
  T.sections.forEach(s=>{
    const raw = (P.sec[s.k]||"").trim();
    if(s.type==="table") S.sections[s.k] = mdTableToRows(raw, s);
    else if(s.type==="checklist"){
      const items = raw.split("\n").map(l=>l.replace(/^-\s*\[[ xX]\]\s*/,"").trim()).filter(Boolean);
      S.sections[s.k] = items.length?items:[""];
    }
    else S.sections[s.k] = raw;
  });
}

/* ============================================================
   FILE SYSTEM
   ============================================================ */

// Names of the database's own subfolders - picking one of these as the root
// is the classic mistake and silently spawns nested Characters/Characters/.
const SUBFOLDER_NAMES = ["characters","world","locations","factions","stories","art","templates","claude chat history","tools","docs","events","trash","site"];

async function looksLikeRoot(h){
  try{ await h.getDirectoryHandle("Templates"); return true; }catch(e){}
  try{ await h.getDirectoryHandle("Characters"); return true; }catch(e){}
  try{ await h.getFileHandle("README.md"); return true; }catch(e){}   // pre-Docs/ layouts
  return false;
}

/* ---- remembering the folder --------------------------------------------
   A folder handle can't be turned into a string, so localStorage is no use -
   it goes in IndexedDB instead. What's stored is a *pointer to* the folder,
   never anything from inside it, so GROUND-RULES rule 1 still holds: delete
   this and nothing about the world is lost, you just pick the folder again.

   All three tools share the one entry, so connecting here means the home page
   and the family tree are connected too. Browsers don't hand permission back
   automatically after a restart, so when a remembered folder needs re-granting
   the button becomes a one-click "Reconnect" instead of the full picker. */
const FOLDER_DB = "cdb-folder", FOLDER_STORE = "handles", FOLDER_KEY = "root";

function folderTx(mode){
  return new Promise((res,rej)=>{
    let rq;
    try{ rq = indexedDB.open(FOLDER_DB, 1); }catch(e){ rej(e); return; }
    rq.onupgradeneeded = ()=>rq.result.createObjectStore(FOLDER_STORE);
    rq.onerror = ()=>rej(rq.error);
    rq.onsuccess = ()=>{
      const db = rq.result, tx = db.transaction(FOLDER_STORE, mode);
      tx.oncomplete = ()=>db.close();
      res(tx.objectStore(FOLDER_STORE));
    };
  });
}

async function rememberFolder(handle){
  try{ (await folderTx("readwrite")).put(handle, FOLDER_KEY); }
  catch(e){}                      // private windows and older browsers say no
}

async function recallFolder(){
  try{
    const store = await folderTx("readonly");
    return await new Promise(res=>{
      const q = store.get(FOLDER_KEY);
      q.onsuccess = ()=>res(q.result || null);
      q.onerror   = ()=>res(null);
    });
  }catch(e){ return null; }
}

function useFolder(h, quiet){
  S.rootHandle = h;
  S.savedHandle = h;
  rememberFolder(h);
  $("fsDot").className = "dot on";
  $("fsLabel").textContent = h.name;
  $("btnConnect").textContent = "Change folder";
  if(!quiet) toast("Connected to " + h.name);
  tryPendingOpen();
  scanSuggestions();          // feed the link/tag dropdowns; fire-and-forget
  syncDeleteBtn();
}

/* On load: if the folder was remembered and the browser still trusts us with
   it, open it without asking. Otherwise leave a one-click Reconnect. */
async function restoreFolder(){
  if(!FS_OK) return;
  const h = await recallFolder();
  if(!h) return;
  S.savedHandle = h;
  let perm = "prompt";
  try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
  if(perm === "granted"){ useFolder(h, true); return; }
  /* Read permission is enough to open and edit. The dashboard and the other
     browsing tools only ask for "read", so a handle arriving from them often
     has read granted while readwrite is still "prompt". Without this
     fallback, a card click on index.html ("#open=...") parked forever and
     the writer showed a blank new entry instead. Write permission is
     requested at Save time, where the click counts as a user gesture. */
  let readPerm = "prompt";
  try{ readPerm = await h.queryPermission({mode:"read"}); }catch(e){}
  if(readPerm === "granted"){ useFolder(h, true); return; }
  $("fsDot").className = "dot warn";
  $("fsLabel").textContent = '"'+h.name+'" - needs a click';
  $("btnConnect").textContent = "Reconnect";
}

async function connectFolder(){
  if(!FS_OK){ showHelp(); return; }

  // a remembered folder only needs its permission renewed - skip the picker
  if(S.savedHandle && S.savedHandle !== S.rootHandle){
    try{
      if(await S.savedHandle.requestPermission({mode:"readwrite"}) === "granted"){
        useFolder(S.savedHandle); return;
      }
    }catch(e){}
  }

  try{
    const h = await window.showDirectoryPicker({ mode:"readwrite" });
    if(!(await looksLikeRoot(h))){
      const why = SUBFOLDER_NAMES.includes(h.name.toLowerCase())
        ? '"' + h.name + '" looks like a subfolder inside the database, not the database itself.'
        : '"' + h.name + '" doesn’t look like the database root (no README.md or Templates folder in it).';
      const repick = confirm(
        why + "\n\nSaving here would create new nested subfolders in the wrong place. " +
        "You probably want the “Character Database” folder itself.\n\n" +
        "OK = pick a different folder · Cancel = use this one anyway");
      if(repick){ connectFolder(); return; }
    }
    useFolder(h);
  }catch(e){
    if(e && e.name === "AbortError") return;
    showHelp(e && e.message);
  }
}

async function subdir(create){
  const parts = TYPES[S.type].folder;
  let h = S.rootHandle;
  for(const p of parts) h = await h.getDirectoryHandle(p, {create:!!create});
  return h;
}

/* ---- renaming --------------------------------------------------------------
   Saving under a new name used to leave the old file sitting there, so one
   entry became two. Now the old file is removed once the new one is safely
   written, and - because a rename silently breaks every `[[old name]]`
   elsewhere - the writer offers to repoint those links too.

   Only ever treated as a rename when the entry stays in the same folder:
   switching the type selector and saving is a different operation, and must
   not delete the original. */

const LINK_DIRS = [["Characters"],["World","Locations"],["World","Factions"],["Stories"],["Events"]];

/* every .md in the database that a wikilink could live in, chapters included */
async function walkLinkFiles(){
  const out = [];
  for(const parts of LINK_DIRS){
    let dir = S.rootHandle, ok = true;
    try{ for(const p of parts) dir = await dir.getDirectoryHandle(p); }catch(e){ ok = false; }
    if(!ok) continue;
    try{
      for await (const [n,h] of dir.entries()){
        if(h.kind === "file" && /\.md$/i.test(n) && !n.startsWith("_")) out.push({h, name:n, dir:parts.join("/")});
        else if(h.kind === "directory"){                       // story manuscript folders
          try{
            for await (const [n2,h2] of h.entries()){
              if(h2.kind === "file" && /\.md$/i.test(n2) && !n2.startsWith("_"))
                out.push({h:h2, name:n2, dir:parts.join("/") + "/" + n});
            }
          }catch(e){}
        }
      }
    }catch(e){}
  }
  return out;
}

function escRe(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* [[Old]] and [[Old|shown as]] both repoint; the display half is untouched */
function repointLinks(text, oldName, newName){
  const re = new RegExp("\\[\\[\\s*" + escRe(oldName) + "\\s*(\\|[^\\]]*)?\\]\\]", "g");
  return text.replace(re, (_, alias)=> "[[" + newName + (alias || "") + "]]");
}

async function repointInboundLinks(oldName, newName, skipFile){
  const files = await walkLinkFiles();
  const hits = [];
  for(const f of files){
    if(f.name === skipFile) continue;
    let text;
    try{ text = await (await f.h.getFile()).text(); }catch(e){ continue; }
    const next = repointLinks(text, oldName, newName);
    if(next !== text) hits.push({f, next});
  }
  if(!hits.length) return 0;

  const where = hits.slice(0, 6).map(h=>"  - " + h.f.dir + "/" + h.f.name).join("\n");
  if(!confirm(
      hits.length + (hits.length === 1 ? " file links" : " files link") + ' to "' + oldName + '":\n\n' +
      where + (hits.length > 6 ? "\n  - …and " + (hits.length - 6) + " more" : "") +
      '\n\nRepoint them to "' + newName + '"?\n\n' +
      "Cancel leaves them pointing at a name that no longer exists.")) return 0;

  let done = 0;
  for(const {f, next} of hits){
    try{
      const w = await f.h.createWritable();
      await w.write(next);
      await w.close();
      done++;
    }catch(e){}
  }
  return done;
}

async function save(){
  const name = String(S.data.name||"").trim();
  if(!name){ toast("Give it a name first.", true); return; }
  S.data.updated = today();
  const text = buildMd();
  const filename = name.replace(/[\\/:*?"<>|]/g,"-") + ".md";

  if(S.rootHandle){
    /* The folder may have been opened with read-only permission (e.g. the
       handle came from the dashboard, which only asks for "read"). Saving
       is a click, so the browser lets us ask for the upgrade right here.
       If it's refused, fall through to the download path below rather
       than losing the work. */
    let wperm = "granted";
    try{ wperm = await S.rootHandle.queryPermission({mode:"readwrite"}); }catch(e){}
    if(wperm !== "granted"){
      try{ wperm = await S.rootHandle.requestPermission({mode:"readwrite"}); }catch(e){ wperm = "denied"; }
    }
    if(wperm === "granted"){
      try{
        const dir = await subdir(true);
        const here = TYPES[S.type].folder.join("/");
        /* a rename: same entry, same folder, different filename */
        const renaming = !!(S.fileHandle && S.fileName && S.fileName !== filename
                            && S.fileFolder === here);
        const oldFile = S.fileName;
        const oldName = oldFile ? oldFile.replace(/\.md$/i, "") : "";

        if(renaming){
          /* don't silently write over a different entry that already owns
             the new name */
          let taken = true;
          try{ await dir.getFileHandle(filename); }catch(e){ taken = false; }
          if(taken && !confirm(
              filename + " already exists in " + here + ".\n\n" +
              "Saving will overwrite that file with this entry, and " + oldFile +
              " will be removed.\n\nGo ahead?")) return;
        }

        const fh = S.fileHandle && S.fileName === filename
          ? S.fileHandle
          : await dir.getFileHandle(filename, {create:true});
        const w = await fh.createWritable();
        await w.write(text);
        await w.close();

        let renameNote = "";
        if(renaming){
          /* the new file is written and closed - only now drop the old one */
          try{
            await dir.removeEntry(oldFile);
            renameNote = " - renamed from " + oldFile;
          }catch(e){
            renameNote = " - but " + oldFile + " is still there, remove it by hand";
          }
        }

        S.fileHandle = fh; S.fileName = filename; S.fileFolder = here;
        S.dirty = false;
        $("fileLabel").classList.remove("unsaved");
        $("fileLabel").textContent = here + "/" + filename;
        toast("Saved " + filename + renameNote);
        scanSuggestions();    // the entry just saved should suggest itself
        syncDeleteBtn();      // a brand-new entry is now deletable

        /* offer to fix every [[old name]] elsewhere, so a rename doesn't
           quietly orphan the links pointing at it */
        if(renaming && oldName && oldName !== name){
          const n = await repointInboundLinks(oldName, name, filename);
          if(n) toast("Repointed " + n + (n === 1 ? " link" : " links") + " to " + name);
        }
        return;
      }catch(e){
        toast("Couldn't write to the folder: " + (e && e.message), true);
        return;
      }
    }
    toast("No write access to the folder - downloading the file instead.", true);
  }
  // fallback: download
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/markdown"}));
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  S.dirty = false;
  $("fileLabel").classList.remove("unsaved");
  $("fileLabel").textContent = filename + " (downloaded)";
  toast("Downloaded " + filename + " - move it into " + TYPES[S.type].folder.join("/"));
}

/* ---- delete ---------------------------------------------------------------
   Deleting is the one action here that can't be undone with Ctrl+Z, so it
   doesn't erase anything: the file is moved to a `Trash/` folder at the
   database root, keeping its own text byte for byte. Recovering a mistake is
   dragging the file back in a file manager; emptying the trash for real is
   deleting that folder yourself. `Trash/` is skipped by the library and by
   search, so a discarded entry stops showing up everywhere else.

   The button only lights up once a saved file is actually open - there is
   nothing to delete about an entry you haven't written yet. */

function syncDeleteBtn(){
  const b = $("btnDelete");
  if(!b) return;
  b.disabled = !(S.rootHandle && S.fileHandle && S.fileName);
  b.title = b.disabled
    ? "Open a saved entry first - there's nothing to delete yet"
    : "Move " + S.fileName + " to the Trash folder";
}

async function deleteEntry(){
  if(!(S.rootHandle && S.fileHandle && S.fileName)) return;
  const filename = S.fileName;
  const from = TYPES[S.type].folder.join("/");

  if(!confirm(
      "Move this entry to the Trash folder?\n\n" + from + "/" + filename + "\n\n" +
      "It leaves " + from + " and lands in Trash/ - nothing is erased, and you can drag " +
      "it back yourself. Links in other files that point at it will show as unwritten.")) return;

  const btn = $("btnDelete");
  btn.disabled = true; btn.textContent = "Deleting…";
  try{
    /* the folder may be connected read-only (a handle from the dashboard) -
       this click is the user gesture the browser wants for the upgrade */
    let perm = "granted";
    try{ perm = await S.rootHandle.queryPermission({mode:"readwrite"}); }catch(e){}
    if(perm !== "granted"){
      try{ perm = await S.rootHandle.requestPermission({mode:"readwrite"}); }catch(e){ perm = "denied"; }
    }
    if(perm !== "granted") throw new Error("write access not granted");

    const text = await (await S.fileHandle.getFile()).text();

    /* never clobber something already in the trash - suffix instead */
    const trash = await S.rootHandle.getDirectoryHandle("Trash", {create:true});
    let target = filename;
    const stem = filename.replace(/\.md$/i, ""), ext = ".md";
    for(let n = 2; n < 500; n++){
      let taken = true;
      try{ await trash.getFileHandle(target); }catch(e){ taken = false; }
      if(!taken) break;
      target = stem + " (" + n + ")" + ext;
    }
    const th = await trash.getFileHandle(target, {create:true});
    const w = await th.createWritable();
    await w.write(text);
    await w.close();

    /* only remove the original once the copy is safely written */
    const dir = await subdir(false);
    await dir.removeEntry(filename);

    S.fileHandle = null; S.fileName = null; S.fileFolder = null; S.dirty = false;
    blank(S.type);
    $("fileLabel").classList.remove("unsaved");
    $("fileLabel").textContent = "no file open";
    render();
    scanSuggestions();
    toast("Moved " + filename + " to Trash/" + (target === filename ? "" : " as " + target));
  }catch(e){
    toast("Couldn't delete: " + (e && e.message), true);
  }finally{
    btn.textContent = "Delete";
    syncDeleteBtn();
  }
}

/* ---- deep-linked open ---------------------------------------------------
   index.html links here as "#open=Arcy Ivory.md&type=character". The folder
   handle usually arrives a beat later (restoreFolder is async), so the
   request parks in PENDING_OPEN and fires as soon as a folder connects -
   including via the one-click Reconnect after a browser restart. */
let PENDING_OPEN = null;

async function openByName(filename, type){
  if(!S.rootHandle || !TYPES[type]) return;
  try{
    let dir = S.rootHandle;
    for(const p of TYPES[type].folder) dir = await dir.getDirectoryHandle(p);
    const fh = await dir.getFileHandle(filename);
    const text = await (await fh.getFile()).text();
    if($("typeSel").value !== type) $("typeSel").value = type;
    loadFromText(text, type);
    S.fileHandle = fh; S.fileName = filename; S.fileFolder = TYPES[type].folder.join("/");
    $("fileLabel").textContent = TYPES[type].folder.join("/") + "/" + filename;
    $("fileLabel").classList.remove("unsaved");
    render();
    toast("Opened " + filename);
  }catch(e){
    toast("Couldn't open " + filename + " - it may have been renamed.", true);
  }
}

function tryPendingOpen(){
  if(!PENDING_OPEN || !S.rootHandle) return;
  const p = PENDING_OPEN; PENDING_OPEN = null;
  openByName(p.file, p.type);
}

async function openPicker(){
  if(!S.rootHandle){
    // fallback: plain file input
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".md,text/markdown";
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      loadFromText(await f.text(), S.type);
      S.fileName = f.name; S.fileFolder = null;
      $("fileLabel").textContent = f.name + " (read-only copy)";
      $("fileLabel").classList.remove("unsaved");
      render();
      toast("Loaded " + f.name + " - saving will download a new copy");
    };
    inp.click();
    return;
  }
  let dir;
  try{ dir = await subdir(false); }
  catch(e){ toast("No " + TYPES[S.type].folder.join("/") + " folder in there yet.", true); return; }

  const names = [];
  for await (const [n, h] of dir.entries()){
    if(h.kind === "file" && n.toLowerCase().endsWith(".md") && !n.startsWith("_about")) names.push(n);
  }
  names.sort((a,b)=>a.localeCompare(b));

  const list = $("fileList");
  list.innerHTML = "";
  if(!names.length){
    list.innerHTML = '<div class="note">Nothing here yet. Write one and save it.</div>';
  }
  names.forEach(n=>{
    const b = document.createElement("button");
    b.textContent = n.replace(/\.md$/,"");
    b.onclick = async () => {
      const fh = await dir.getFileHandle(n);
      const text = await (await fh.getFile()).text();
      loadFromText(text, S.type);
      S.fileHandle = fh; S.fileName = n; S.fileFolder = TYPES[S.type].folder.join("/");
      $("fileLabel").textContent = TYPES[S.type].folder.join("/") + "/" + n;
      $("fileLabel").classList.remove("unsaved");
      $("openDlg").close();
      render();
      toast("Opened " + n);
    };
    list.appendChild(b);
  });
  $("openDlg").showModal();
}

function showHelp(extra){
  $("helpBody").innerHTML =
    "<p>Direct folder access needs Chrome or Edge, and the page has to be served rather than opened straight from disk. "+
    "Firefox and Safari don't support it at all.</p>"+
    "<p><b>You can ignore this.</b> Without it the tool still works - <b>Save</b> downloads the <code>.md</code> file and you drag it into the right folder.</p>"+
    "<p>If you want the direct-write version: open a terminal in your <code>Character Database</code> folder and run "+
